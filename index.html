    if (activeBtn) activeBtn.classList.add('active');
  },

  showAISelect() {
    document.getElementById('ai-select').style.display = 'flex';
    Audio.click();
  },

  hideAISelect() {
    document.getElementById('ai-select').style.display = 'none';
    Audio.click();
  },

  confirmQuit() {
    if (confirm('Leave battle and return to menu?')) {
      this.showMenu();
      this.draw();
    }
  },

  quitFromShop() {
    document.getElementById('shop-screen').classList.add('hidden');
    this.showMenu();
    this.draw();
  },

  showStats() {
    Audio.click();
    const d = Progression.data;
    const winRate = d.totalGames > 0 ? Math.round(d.wins / d.totalGames * 100) : 0;
    document.getElementById('stats-body').innerHTML =
      `<span>Level:</span> ${d.level}<br>` +
      `<span>XP:</span> ${d.xp} / ${d.level * Progression.xpPerLevel}<br>` +
      `<span>Total Games:</span> ${d.totalGames}<br>` +
      `<span>Wins:</span> ${d.wins} (${winRate}%)<br>` +
      `<span>Total Damage:</span> ${d.totalDamage}<br>` +
      `<span>Total Kills:</span> ${d.totalKills}<br>` +
      `<span>Best Kill Streak:</span> ${d.killStreakMax || 0}<br>` +
      `<span>Favorite Weapon:</span> ${Progression.favoriteWeapon()}<br><br>` +
      `<span>Unlocked Weapons:</span><br>` +
      Object.entries(WEAPONS)
        .filter(([k]) => Progression.isWeaponUnlocked(k))
        .map(([k, w]) => w.icon + ' ' + w.name)
        .join(', ');
    document.getElementById('stats-screen').classList.remove('hidden');
  },

  closeStats() {
    Audio.click();
    document.getElementById('stats-screen').classList.add('hidden');
  },

  startQuickMatch() {
    Audio.click();
    this.mode = 'quick';
    this.maxRounds = 1;
    this.roundNum = 1;
    this.initRound([
      new Tank('Player 1', '#4a4', 0, false),
      new Tank('Player 2', '#d44', 0, false)
    ]);
  },

  startVsAI(diff) {
    Audio.click();
    this.mode = 'vsai';
    this.maxRounds = 1;
    this.roundNum = 1;
    this.initRound([
      new Tank('Player 1', '#4a4', 0, false),
      new Tank('CPU', '#d44', 0, true, diff)
    ]);
  },

  startCampaign() {
    Audio.click();
    this.mode = 'campaign';
    this.campaignLevel = 1;
    this.maxRounds = 10;
    this.roundNum = 1;
    const diffs = ['easy','easy','easy','medium','medium','medium','hard','hard','hard','hard'];
    this.initRound([
      new Tank('Player 1', '#4a4', 0, false),
      new Tank('CPU Lv' + this.campaignLevel, '#d44', 0, true, diffs[0])
    ]);
  },

  initRound(tanks) {
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('shop-screen').classList.add('hidden');
    document.getElementById('victory-screen').classList.add('hidden');
    document.getElementById('smoke-screen').classList.add('hidden');
    this.hideMsg();
    this.matchWeaponUses = {};

    // Campaign biome cycling
    let biome = this.currentBiome;
    if (this.mode === 'campaign') {
      const biomeOrder = ['tropical','desert','tropical','winter','desert','volcanic','winter','city','space','volcanic'];
      biome = biomeOrder[(this.campaignLevel - 1) % biomeOrder.length];
      this.currentBiome = biome;
    }

    Terrain.generate(W, H, biome);
    if (BIOMES[biome].hasStars) Stars.generate();
    AmbientParticles.generate(biome);

    // Place tanks
    const margin = W * 0.15;
    tanks[0].x = margin + Math.random() * (W * 0.2);
    tanks[1].x = W - margin - Math.random() * (W * 0.2);
    tanks[0].facingRight = true;
    tanks[1].facingRight = false;
    tanks.forEach(t => {
      t.hp = 100;
      t.updateY();
      t.shield = false;
      t.smokeActive = false;
      t.matchDamage = 0;
      t.matchKills = 0;
    });
    this.tanks = tanks;
    this.turnIndex = 0;
    const b = BIOMES[biome];
    this.wind = b.noWind ? 0 : Math.round((Math.random() - 0.5) * 60);
    this.lastTrail = [];
    Frederic.init();
    Frederic.blocking = false;
    Particles.list = [];
    Explosions.list = [];
    Lightning.bolts = [];
    Airstrike.active = false;
    MeteorShower.active = false;
    LaserBeam.active = false;
    Projectile.active = false;
    Projectile.trail = [];
    KillStreak.reset();

    this.state = 'playing';
    this.updateHUD();
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    this.updateControls();

    if (!this._looping) { this._looping = true; this.lastTime = performance.now(); requestAnimationFrame(t => this.loop(t)); }
  },

  // --- HUD ---
  updateHUD() {
    const cur = this.tanks[this.turnIndex];
    document.getElementById('hud-turn').textContent = cur.name + "'s turn";
    document.getElementById('hud-turn').style.color = cur.color;
    const windStr = (this.wind > 0 ? '\u2192 ' : this.wind < 0 ? '\u2190 ' : '') + Math.abs(this.wind);
    document.getElementById('hud-wind').textContent = windStr;
    document.getElementById('hud-hp1').style.width = Math.max(0, this.tanks[0].hp) + '%';
    document.getElementById('hud-hp2').style.width = Math.max(0, this.tanks[1].hp) + '%';
    document.getElementById('hud-weapon').textContent = WEAPONS[cur.currentWeapon].name;
    document.getElementById('hud-coins').textContent = cur.coins;
    document.getElementById('hud-level').textContent = Progression.data.level;
  },

  updateControls() {
    const cur = this.tanks[this.turnIndex];
    document.getElementById('ctrl-angle').value = cur.angle;
    document.getElementById('ctrl-angle-val').textContent = cur.angle + '\u00B0';
    document.getElementById('ctrl-power').value = cur.power;
    document.getElementById('ctrl-power-val').textContent = cur.power + '%';
    const w = WEAPONS[cur.currentWeapon];
    const count = cur.weapons[cur.currentWeapon];
    document.getElementById('weapon-cycle').textContent = w.icon + ' ' + w.name + (count === Infinity ? ' \u221E' : ' \u00D7' + count);
    document.getElementById('fire-btn').disabled = (this.state !== 'playing');
  },

  cycleWeapon() {
    const cur = this.tanks[this.turnIndex];
    const keys = Object.keys(cur.weapons);
    const idx = keys.indexOf(cur.currentWeapon);
    cur.currentWeapon = keys[(idx + 1) % keys.length];
    Audio.click();
    this.updateControls();
    this.updateHUD();
  },

  // --- Firing ---
  fire() {
    if (this.state !== 'playing') return;
    const cur = this.tanks[this.turnIndex];
    cur.angle = parseInt(document.getElementById('ctrl-angle').value);
    cur.power = parseInt(document.getElementById('ctrl-power').value);
    const weapon = cur.currentWeapon;

    // Track weapon usage
    this.matchWeaponUses[weapon] = (this.matchWeaponUses[weapon] || 0) + 1;
    Progression.data.weaponUses[weapon] = (Progression.data.weaponUses[weapon] || 0) + 1;

    // Handle special weapons
    if (weapon === 'shield') {
      cur.shield = true;
      this.useWeapon(cur, weapon);
      this.showMsg('Shield activated!', 1000);
      setTimeout(() => this.endTurn(), 1200);
      return;
    }
    if (weapon === 'teleport') {
      cur.x = 50 + Math.random() * (W - 100);
      cur.updateY();
      this.useWeapon(cur, weapon);
      Particles.add(cur.x, cur.y, 20, '#0ff', 4, 0.5);
      this.showMsg('Teleported!', 1000);
      setTimeout(() => this.endTurn(), 1200);
      return;
    }
    if (weapon === 'repair') {
      const healed = Math.min(25, cur.maxHp - cur.hp);
      cur.hp = Math.min(cur.maxHp, cur.hp + 25);
      this.useWeapon(cur, weapon);
      Particles.add(cur.x, cur.y - 10, 15, '#4f4', 2, 0.8);
      DamageNumbers.spawn(cur.x, cur.y - 30, healed, true);
      Audio.heal();
      this.showMsg('Repaired +' + healed + ' HP!', 1000);
      setTimeout(() => this.endTurn(), 1200);
      return;
    }
    if (weapon === 'dig') {
      Terrain.digBelow(cur.x, 40);
      cur.updateY();
      this.useWeapon(cur, weapon);
      Particles.add(cur.x, cur.y, 10, '#8a6e2f', 2, 0.5);
      this.showMsg('Terrain dug!', 1000);
      setTimeout(() => this.endTurn(), 1200);
      return;
    }
    if (weapon === 'smoke') {
      this.useWeapon(cur, weapon);
      // Mark enemy as having smoke on their next turn
      const enemy = this.tanks[1 - this.turnIndex];
      enemy.smokeActive = true;
      Particles.add(cur.x, cur.y, 30, '#888', 3, 1.5);
      this.showMsg('Smoke screen deployed!', 1000);
      setTimeout(() => this.endTurn(), 1200);
      return;
    }
    if (weapon === 'earthquake') {
      this.useWeapon(cur, weapon);
      Terrain.shakeEarthquake();
      CameraShake.trigger(15, 1.0);
      Audio.rumble();
      // Damage both tanks
      this.tanks.forEach(t => {
        if (t.hp > 0) {
          const dmg = WEAPONS.earthquake.damage;
          this.damageTank(t, dmg);
          DamageNumbers.spawn(t.x, t.y - 30, dmg, false);
          t.updateY();
        }
      });
      Particles.add(W / 2, H * 0.5, 40, '#a80', 4, 1);
      this.showMsg('EARTHQUAKE!', 1200);
      setTimeout(() => this.postExplosion(), 1300);
      this.state = 'animating';
      document.getElementById('fire-btn').disabled = true;
      return;
    }
    if (weapon === 'laser') {
      const tip = cur.getBarrelTip();
      this.useWeapon(cur, weapon);
      const result = LaserBeam.fire(tip.x, tip.y, cur.angle, cur.facingRight, this.tanks);
      this.state = 'animating';
      document.getElementById('fire-btn').disabled = true;
      setTimeout(() => {
        if (result.type === 'hit') {
          this.doExplosion(result.x, result.y, WEAPONS.laser.radius, WEAPONS.laser.damage);
        }
        this.postExplosion();
      }, 500);
      return;
    }
    if (weapon === 'airstrike') {
      const enemy = this.tanks[1 - this.turnIndex];
      Airstrike.start(enemy.x);
      this.useWeapon(cur, weapon);
      this.state = 'animating';
      document.getElementById('fire-btn').disabled = true;
      return;
    }
    if (weapon === 'meteor') {
      MeteorShower.start();
      this.useWeapon(cur, weapon);
      this.state = 'animating';
      document.getElementById('fire-btn').disabled = true;
      return;
    }

    // Normal projectile (including homing, bouncing)
    const tip = cur.getBarrelTip();
    const actualAngle = cur.facingRight ? cur.angle : (180 - cur.angle);
    const homingTarget = weapon === 'homing' ? this.tanks[1 - this.turnIndex] : null;
    Projectile.launch(tip.x, tip.y, actualAngle, cur.power, this.wind, weapon, homingTarget);
    this.useWeapon(cur, weapon);
    this.state = 'animating';
    document.getElementById('fire-btn').disabled = true;
  },

  useWeapon(tank, weapon) {
    if (tank.weapons[weapon] !== Infinity) {
      tank.weapons[weapon]--;
      if (tank.weapons[weapon] <= 0) {
        delete tank.weapons[weapon];
        tank.currentWeapon = 'shell';
      }
    }
  },

  // --- Hit Processing ---
  processHit(result) {
    if (result.type === 'miss') {
      this.lastTrail = [...Projectile.trail];
      this.endTurn();
      return;
    }
    if (result.type === 'blocked') {
      this.showMsg('Frederic blocked the shot!', 1500);
      this.lastTrail = [...Projectile.trail];
      setTimeout(() => this.endTurn(), 1500);
      return;
    }
    if (result.type === 'cluster') {
      this.lastTrail = [...Projectile.trail];
      const cx = result.x, cy = result.y;
      let pending = 5;
      for (let i = 0; i < 5; i++) {
        const bx = cx + (Math.random() - 0.5) * 80;
        const by = cy + (Math.random() - 0.5) * 40;
        setTimeout(() => {
          this.doExplosion(bx, Math.max(by, Terrain.heightAt(bx)), WEAPONS.cluster.radius, WEAPONS.cluster.damage);
          pending--;
          if (pending === 0) this.postExplosion();
        }, 100 + i * 150);
      }
      return;
    }
    if (result.type === 'hit') {
      this.lastTrail = [...Projectile.trail];
      const w = WEAPONS[result.weapon] || WEAPONS.shell;
      if (result.weapon === 'napalm') {
        this.doExplosion(result.x, result.y, w.radius, w.damage);
        Terrain.burnSurface(result.x, 60);
        for (let fx = result.x - 60; fx < result.x + 60; fx += 10) {
          Particles.add(fx, Terrain.heightAt(fx), 3, '#f80', 2, 1.5);
        }
        this.tanks.forEach(t => {
          if (Math.abs(t.x - result.x) < 60) {
            this.damageTank(t, 15);
          }
        });
        this.postExplosion();
      } else {
        this.doExplosion(result.x, result.y, w.radius, w.damage);
        this.postExplosion();
      }
      return;
    }
  },

  doExplosion(x, y, radius, damage) {
    Terrain.crater(x, y, radius);
    Explosions.add(x, y, radius);
    Particles.add(x, y, 15 + radius, '#f80', 3 + radius * 0.05, 0.8);
    Particles.add(x, y, 5, '#fff', 2, 0.3);
    Audio.explode(radius > 50);

    // Camera shake proportional to radius
    CameraShake.trigger(Math.min(radius * 0.3, 20), 0.4);

    // Damage tanks in blast radius
    this.tanks.forEach(t => {
      if (t.hp <= 0) return;
      const dist = Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2);
      if (dist < radius + 15) {
        const falloff = Math.max(0, 1 - dist / (radius + 15));
        const dmg = Math.round(damage * falloff);
        if (dmg > 0) {
          this.damageTank(t, dmg);
          DamageNumbers.spawn(t.x, t.y - 30, dmg, false);
        }
      }
    });
  },

  damageTank(tank, dmg) {
    if (tank.shield) {
      tank.shield = false;
      Particles.add(tank.x, tank.y - 10, 10, '#0ff', 3, 0.5);
      return;
    }
    const prevHp = tank.hp;
    tank.hp = Math.max(0, tank.hp - dmg);
    const actualDmg = prevHp - tank.hp;
    // Award coins & track stats for shooter
    const shooter = this.tanks[this.turnIndex];
    if (tank !== shooter && actualDmg > 0) {
      shooter.coins += actualDmg * 2;
      shooter.matchDamage += actualDmg;
      if (tank.hp <= 0) {
        shooter.matchKills++;
        KillStreak.recordKill(shooter);
      }
    }
  },

  postExplosion() {
    this.gravityChecking = true;
    const settle = () => {
      let anyFalling = false;
      this.tanks.forEach(t => {
        if (t.hp > 0 && t.applyGravity()) anyFalling = true;
      });
      if (anyFalling) {
        requestAnimationFrame(settle);
      } else {
        this.gravityChecking = false;
        const alive = this.tanks.filter(t => t.hp > 0);
        if (alive.length <= 1) {
          this.roundOver(alive[0] || null);
        } else {
          this.endTurn();
        }
      }
    };
    setTimeout(settle, 300);
  },

  endTurn() {
    // Clear smoke if active on current player
    const cur = this.tanks[this.turnIndex];
    document.getElementById('smoke-screen').classList.add('hidden');

    this.turnIndex = 1 - this.turnIndex;
    const b = BIOMES[this.currentBiome];
    if (!b.noWind) {
      this.wind += Math.round((Math.random() - 0.5) * 20);
      this.wind = Math.max(-60, Math.min(60, this.wind));
    }
    this.state = 'playing';

    // Apply smoke screen if next player has smoke active
    const next = this.tanks[this.turnIndex];
    if (next.smokeActive && !next.isAI) {
      document.getElementById('smoke-screen').classList.remove('hidden');
      next.smokeActive = false;
      // Remove after a brief delay
      setTimeout(() => {
        document.getElementById('smoke-screen').classList.add('hidden');
      }, 2500);
    } else {
      next.smokeActive = false;
    }

    // Cloud event (15% chance)
    this.cloudEvent = null;
    Frederic.blocking = false;
    if (Math.random() < 0.15) {
      this.triggerCloudEvent();
    }

    this.updateHUD();
    this.updateControls();

    // AI turn
    if (next.isAI && next.hp > 0) {
      document.getElementById('fire-btn').disabled = true;
      setTimeout(() => this.aiTurn(), 800);
    }
  },

  // --- Cloud Events ---
  triggerCloudEvent() {
    const events = ['lightning', 'rain', 'gust', 'block'];
    const ev = events[Math.floor(Math.random() * events.length)];
    Frederic.makeAngry();

    switch (ev) {
      case 'lightning': {
        const x = 50 + Math.random() * (W - 100);
        const y = Terrain.heightAt(x);
        Lightning.strike(x, y);
        Terrain.crater(x, y, 20);
        this.tanks.forEach(t => {
          if (Math.abs(t.x - x) < 25) this.damageTank(t, 15);
        });
        this.showMsg("Frederic strikes with lightning!", 1500);
        break;
      }
      case 'rain': {
        this.showMsg("Rain! Terrain gets slippery!", 1500);
        this.tanks.forEach(t => {
          const leftH = Terrain.heightAt(t.x - 10);
          const rightH = Terrain.heightAt(t.x + 10);
          if (leftH > rightH) t.x += 8;
          else if (rightH > leftH) t.x -= 8;
          t.x = Math.max(20, Math.min(W - 20, t.x));
          t.updateY();
        });
        for (let i = 0; i < 50; i++) {
          Particles.add(Math.random() * W, Math.random() * H * 0.5, 1, '#8af', 1, 2);
        }
        break;
      }
      case 'gust': {
        this.wind *= 2;
        this.wind = Math.max(-80, Math.min(80, this.wind));
        this.showMsg("Strong gust! Wind doubled!", 1500);
        Audio.wind();
        break;
      }
      case 'block': {
        Frederic.blocking = true;
        Frederic.x = (this.tanks[0].x + this.tanks[1].x) / 2;
        Frederic.y = H * 0.2;
        this.showMsg("Frederic might block your shot!", 1500);
        break;
      }
    }
  },

  // --- AI ---
  aiTurn() {
    const ai = this.tanks[this.turnIndex];
    const target = this.tanks[1 - this.turnIndex];
    const diff = ai.aiDifficulty;

    const dx = target.x - ai.x;
    const dist = Math.abs(dx);

    let bestAngle = 45;
    let bestPower = 50;

    const biomeGrav = (BIOMES[this.currentBiome] || BIOMES.tropical).gravity;
    const g = biomeGrav * 3;
    const windEffect = this.wind * 0.0005 * 3;

    let bestErr = Infinity;
    const angleRange = diff === 'easy' ? 30 : diff === 'medium' ? 10 : 3;
    const trials = diff === 'easy' ? 20 : diff === 'medium' ? 50 : 100;

    for (let trial = 0; trial < trials; trial++) {
      const testAngle = 10 + Math.random() * 80;
      const testPower = 20 + Math.random() * 80;
      const rad = -(ai.facingRight ? testAngle : (180 - testAngle)) * Math.PI / 180;
      const speed = testPower * 0.18;
      let vx = Math.cos(rad) * speed;
      let vy = Math.sin(rad) * speed;
      let sx = ai.x, sy = ai.y - ai.height;

      let hit = false;
      for (let step = 0; step < 500; step++) {
        vy += biomeGrav;
        vx += windEffect / 3;
        sx += vx; sy += vy;
        if (sy > H + 50) break;
        if (sy >= Terrain.heightAt(sx)) {
          const err = Math.sqrt((sx - target.x) ** 2 + (sy - target.y) ** 2);
          if (err < bestErr) {
            bestErr = err;
            bestAngle = testAngle;
            bestPower = testPower;
          }
          hit = true;
          break;
        }
      }
    }

    bestAngle += (Math.random() - 0.5) * angleRange * 2;
    bestPower += (Math.random() - 0.5) * angleRange;
    bestAngle = Math.max(5, Math.min(85, bestAngle));
    bestPower = Math.max(15, Math.min(100, bestPower));

    ai.angle = Math.round(bestAngle);
    ai.power = Math.round(bestPower);

    document.getElementById('ctrl-angle').value = ai.angle;
    document.getElementById('ctrl-angle-val').textContent = ai.angle + '\u00B0';
    document.getElementById('ctrl-power').value = ai.power;
    document.getElementById('ctrl-power-val').textContent = ai.power + '%';

    setTimeout(() => {
      if (this.state === 'playing') this.fire();
    }, 500);
  },

  // --- Round Over ---
  roundOver(winner) {
    this.state = 'gameover';
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('smoke-screen').classList.add('hidden');

    // Calculate XP
    const player = this.tanks.find(t => !t.isAI) || this.tanks[0];
    const won = winner === player;
    const xpGained = Math.round(player.matchDamage * 0.5 + (won ? 100 : 20) + player.matchKills * 30);
    const leveledUp = Progression.addXP(xpGained);

    // Record to progression
    const mostUsed = Object.entries(this.matchWeaponUses).sort((a,b) => b[1] - a[1])[0];
    Progression.recordGame(won, player.matchDamage, player.matchKills, mostUsed ? mostUsed[0] : 'shell');

    if (winner) {
      winner.coins += 100;
      Audio.win();
    }

    // Show victory/defeat screen
    setTimeout(() => {
      const titleEl = document.getElementById('victory-title');
      const statsEl = document.getElementById('victory-stats');

      if (winner) {
        titleEl.textContent = winner.name + ' WINS!';
        titleEl.style.color = won ? '#4f4' : '#f44';
      } else {
        titleEl.textContent = 'DRAW!';
        titleEl.style.color = '#ff6';
      }

      let statsHtml =
        `Damage Dealt: <span>${player.matchDamage}</span><br>` +
        `Kills: <span>${player.matchKills}</span><br>` +
        `XP Gained: <span>+${xpGained}</span><br>` +
        `Level: <span>${Progression.data.level}</span>`;
      if (leveledUp) {
        statsHtml += `<br><span style="color:#ff0;font-size:1.3em">LEVEL UP!</span>`;
        // Check new weapon unlocks
        const newWeapons = Object.entries(WEAPONS).filter(([k, w]) => w.unlockLevel === Progression.data.level);
        if (newWeapons.length > 0) {
          statsHtml += '<br>New weapons unlocked: ' + newWeapons.map(([k, w]) => '<span>' + w.icon + ' ' + w.name + '</span>').join(', ');
        }
      }
      statsEl.innerHTML = statsHtml;
      document.getElementById('victory-screen').classList.remove('hidden');
    }, 1500);
  },

  closeVictory() {
    Audio.click();
    document.getElementById('victory-screen').classList.add('hidden');

    if (this.mode === 'campaign') {
      const player = this.tanks.find(t => !t.isAI) || this.tanks[0];
      const winner = this.tanks.find(t => t.hp > 0);
      if (winner && !winner.isAI) {
        this.campaignLevel++;
        if (this.campaignLevel > 10) {
          this.showMsg('CAMPAIGN COMPLETE! You are the Tank Blaster champion!', 0);
          setTimeout(() => this.showMenu(), 3000);
        } else {
          this.openShop(player);
        }
      } else {
        this.showMsg('Campaign Over \u2014 You reached level ' + this.campaignLevel, 0);
        setTimeout(() => this.showMenu(), 3000);
      }
    } else {
      this.showMenu();
    }
  },

  // --- Shop ---
  openShop(playerTank) {
    this.hideMsg();
    this.state = 'shop';
    document.getElementById('hud').classList.add('hidden');
    const shopEl = document.getElementById('shop-screen');
    shopEl.classList.remove('hidden');
    document.getElementById('shop-coins').textContent = 'Coins: ' + playerTank.coins;

    const grid = document.getElementById('shop-grid');
    grid.innerHTML = '';
    Object.entries(WEAPONS).forEach(([key, w]) => {
      if (key === 'shell') return;
      const item = document.createElement('div');
      item.className = 'shop-item';
      const owned = playerTank.weapons[key] > 0;
      const unlocked = Progression.isWeaponUnlocked(key);
      if (owned) item.classList.add('owned');
      if (!unlocked) item.classList.add('locked');
      let html = `
        <div class="shop-item-name">${w.icon} ${w.name}</div>
        <div class="shop-item-price">${w.price} coins${owned ? ' (owned: '+ playerTank.weapons[key]+')' : ''}</div>
        <div class="shop-item-desc">${w.desc}</div>
      `;
      if (!unlocked) {
        html += `<div class="shop-item-lock">Unlocks at Level ${w.unlockLevel}</div>`;
      }
      item.innerHTML = html;
      item.onclick = () => {
        if (!unlocked) return;
        if (playerTank.coins >= w.price) {
          playerTank.coins -= w.price;
          playerTank.weapons[key] = (playerTank.weapons[key] || 0) + 1;
          Audio.click();
          document.getElementById('shop-coins').textContent = 'Coins: ' + playerTank.coins;
          this.openShop(playerTank);
        }
      };
      grid.appendChild(item);
    });

    this._shopTank = playerTank;
  },

  closeShop() {
    Audio.click();
    document.getElementById('shop-screen').classList.add('hidden');
    const diffs = ['easy','easy','easy','medium','medium','medium','hard','hard','hard','hard'];
    const p = this._shopTank;
    this.initRound([
      p,
      new Tank('CPU Lv' + this.campaignLevel, '#d44', 0, true, diffs[this.campaignLevel - 1])
    ]);
  },

  // --- Messaging ---
  showMsg(text, autoHide) {
    const el = document.getElementById('msg-box');
    el.innerHTML = text;
    el.classList.remove('hidden');
    if (autoHide > 0) setTimeout(() => el.classList.add('hidden'), autoHide);
  },
  hideMsg() { document.getElementById('msg-box').classList.add('hidden'); },

  // --- Rendering ---
  render() {
    const biome = this.currentBiome;
    const b = BIOMES[biome] || BIOMES.tropical;

    ctx.save();
    ctx.translate(CameraShake.offsetX, CameraShake.offsetY);
    ctx.clearRect(-20, -20, W + 40, H + 40);

    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    b.sky.forEach(([c, s]) => skyGrad.addColorStop(s, c));
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Stars (space biome)
    if (b.hasStars) {
      Stars.draw(ctx, performance.now() * 0.001);
    }

    // Sun
    const sunX = W * 0.82, sunY = H * 0.18;
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 80);
    sunGlow.addColorStop(0, b.sunGlowInner);
    sunGlow.addColorStop(0.3, b.sunGlowInner.replace(/[\d.]+\)$/, '0.4)'));
    sunGlow.addColorStop(1, b.sunGlowOuter);
    ctx.fillStyle = sunGlow;
    ctx.fillRect(sunX - 80, sunY - 80, 160, 160);
    ctx.beginPath();
    ctx.arc(sunX, sunY, 22, 0, Math.PI * 2);
    ctx.fillStyle = b.sunColor;
    ctx.fill();

    // Background clouds (skip for space/volcanic)
    if (biome !== 'space' && biome !== 'volcanic') {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      const bgClouds = [[W*0.1, H*0.08, 40], [W*0.35, H*0.14, 30], [W*0.6, H*0.06, 35], [W*0.9, H*0.11, 25]];
      bgClouds.forEach(([cx,cy,r]) => {
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx-r*0.6, cy+4, r*0.7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+r*0.6, cy+4, r*0.7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy+6, r*0.5, 0, Math.PI*2); ctx.fill();
      });
    }

    // Background buildings for city biome
    if (biome === 'city') {
      const waterY = H * 0.85;
      ctx.fillStyle = '#334';
      for (let i = 0; i < 10; i++) {
        const bx = i * (W / 10);
        const bh = 60 + Math.sin(i * 2.3) * 40;
        ctx.fillRect(bx, waterY - bh, W / 12, bh);
        // Windows
        ctx.fillStyle = '#ffa';
        for (let wy = waterY - bh + 5; wy < waterY - 3; wy += 8) {
          for (let wx = bx + 3; wx < bx + W / 12 - 3; wx += 6) {
            if (Math.random() > 0.3) ctx.fillRect(wx, wy, 3, 4);
          }
        }
        ctx.fillStyle = '#334';
      }
    }

    // Ocean / Lava / Space void
    const waterY = H * 0.85;
    // Beach foam strip
    ctx.fillStyle = b.foam;
    ctx.fillRect(0, waterY - 3, W, 6);
    // Water
    const waterGrad = ctx.createLinearGradient(0, waterY, 0, H);
    b.waterGrad.forEach(([c, s]) => waterGrad.addColorStop(s, c));
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, waterY, W, H - waterY);

    // Animated waves (skip for space)
    if (biome !== 'space') {
      const waveTime = performance.now() * 0.001;
      ctx.strokeStyle = b.waterFoam;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let wx = 0; wx < W; wx += 2) {
        const wh = Math.sin(wx * 0.03 + waveTime * 2) * 2;
        wx === 0 ? ctx.moveTo(wx, waterY + wh) : ctx.lineTo(wx, waterY + wh);
      }
      ctx.stroke();
      ctx.strokeStyle = b.waterHighlight;
      ctx.lineWidth = 1;
      for (let wy = waterY + 8; wy < H; wy += 14) {
        ctx.beginPath();
        for (let wx = 0; wx < W; wx += 3) {
          const wh = Math.sin(wx * 0.02 + waveTime + wy * 0.1) * 2;
          wx === 0 ? ctx.moveTo(wx, wy + wh) : ctx.lineTo(wx, wy + wh);
        }
        ctx.stroke();
      }
      // Lava glow effect
      if (b.hasLava) {
        ctx.fillStyle = `rgba(255,100,0,${0.15 + Math.sin(waveTime * 3) * 0.1})`;
        ctx.fillRect(0, waterY, W, H - waterY);
      }
      // Sparkle
      if (!b.hasLava) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (let s = 0; s < 12; s++) {
          const sx = ((s * 97.3 + waveTime * 20) % W);
          const sy = waterY + 5 + ((s * 41.7) % (H - waterY - 10));
          if (Math.sin(waveTime * 3 + s) > 0.7) ctx.fillRect(sx, sy, 2, 1);
        }
      }
    }

    // Terrain
    Terrain.draw(ctx, biome);

    // Ambient particles (snow, ash)
    AmbientParticles.draw(ctx);

    // Trail from last shot
    if (this.lastTrail.length > 1) {
      ctx.setLineDash([3, 5]);
      ctx.strokeStyle = 'rgba(255,255,100,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      this.lastTrail.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Tanks
    this.tanks.forEach((t, i) => {
      if (t.hp > 0) t.draw(ctx, i === this.turnIndex && this.state === 'playing');
    });

    // Frederic
    Frederic.draw(ctx);

    // Projectile
    Projectile.draw(ctx);

    // Airstrike
    Airstrike.draw(ctx);

    // Meteor shower
    MeteorShower.draw(ctx);

    // Laser beam
    LaserBeam.draw(ctx);

    // Effects
    Explosions.draw(ctx);
    Particles.draw(ctx);
    Lightning.draw(ctx);

    ctx.restore();
  },

  // --- Game Loop ---
  lastTime: 0,
  loop(time) {
    const dt = Math.min(0.05, (time - this.lastTime) / 1000);
    this.lastTime = time;

    // Update
    Frederic.update(dt);
    Particles.update(dt);
    Explosions.update(dt);
    Lightning.update(dt);
    CameraShake.update(dt);
    LaserBeam.update(dt);
    AmbientParticles.update(dt);

    const biomeGrav = (BIOMES[this.currentBiome] || BIOMES.tropical).gravity;

    // Projectile
    if (Projectile.active) {
      const result = Projectile.update(dt, this.wind, this.tanks, biomeGrav);
      if (result) this.processHit(result);
    }

    // Airstrike
    if (Airstrike.active) {
      const hits = Airstrike.update(dt);
      hits.forEach(h => {
        const w = WEAPONS.airstrike;
        this.doExplosion(h.x, h.y, w.radius, w.damage);
      });
      if (!Airstrike.active) {
        this.postExplosion();
      }
    }

    // Meteor shower
    if (MeteorShower.active) {
      const hits = MeteorShower.update(dt);
      hits.forEach(h => {
        const w = WEAPONS.meteor;
        this.doExplosion(h.x, h.y, w.radius, w.damage);
      });
      if (!MeteorShower.active) {
        this.postExplosion();
      }
    }

    // Gravity settling
    if (this.gravityChecking) {
      this.tanks.forEach(t => { if (t.hp > 0) t.applyGravity(); });
    }

    this.render();
    requestAnimationFrame(t => this.loop(t));
  },
};

// --- Slider Events ---
document.getElementById('ctrl-angle').addEventListener('input', function() {
  document.getElementById('ctrl-angle-val').textContent = this.value + '\u00B0';
  if (Game.state === 'playing') Game.tanks[Game.turnIndex].angle = parseInt(this.value);
});
document.getElementById('ctrl-power').addEventListener('input', function() {
  document.getElementById('ctrl-power-val').textContent = this.value + '%';
  if (Game.state === 'playing') Game.tanks[Game.turnIndex].power = parseInt(this.value);
});

// --- Keyboard Controls ---
document.addEventListener('keydown', e => {
  if (Game.state !== 'playing') return;
  const cur = Game.tanks[Game.turnIndex];
  if (cur.isAI) return;
  const angleEl = document.getElementById('ctrl-angle');
  const powerEl = document.getElementById('ctrl-power');
  switch (e.key) {
    case 'ArrowLeft':
      cur.angle = Math.min(180, cur.angle + 1);
      angleEl.value = cur.angle;
      document.getElementById('ctrl-angle-val').textContent = cur.angle + '\u00B0';
      break;
    case 'ArrowRight':
      cur.angle = Math.max(0, cur.angle - 1);
      angleEl.value = cur.angle;
      document.getElementById('ctrl-angle-val').textContent = cur.angle + '\u00B0';
      break;
    case 'ArrowUp':
      cur.power = Math.min(100, cur.power + 1);
      powerEl.value = cur.power;
      document.getElementById('ctrl-power-val').textContent = cur.power + '%';
      break;
    case 'ArrowDown':
      cur.power = Math.max(5, cur.power - 1);
      powerEl.value = cur.power;
      document.getElementById('ctrl-power-val').textContent = cur.power + '%';
      break;
    case ' ':
    case 'Enter':
      e.preventDefault();
      Game.fire();
      break;
    case 'Tab':
      e.preventDefault();
      Game.cycleWeapon();
      break;
  }
});

// --- Initial render for menu background ---
Terrain.generate(W, H, Game.currentBiome);
if (BIOMES[Game.currentBiome].hasStars) Stars.generate();
AmbientParticles.generate(Game.currentBiome);
Frederic.init();
Game.showMenu();
Game._looping = true;
Game.lastTime = performance.now();
requestAnimationFrame(t => Game.loop(t));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
