<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tank Blaster 2: The Crazy Artillery Game</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6600">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; user-select: none; }
canvas { display: block; }
#ui-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#ui-overlay > * { pointer-events: auto; }
.screen-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85); z-index: 100;
}
.screen-overlay.hidden { display: none; }
.menu-title {
  font-size: 2.5em; color: #ff6; text-shadow: 3px 3px 0 #a30, 0 0 20px #f80;
  margin-bottom: 10px; text-align: center;
}
.menu-subtitle { font-size: 1em; color: #f90; margin-bottom: 30px; text-align: center; }
.menu-btn {
  display: block; width: 280px; padding: 16px 24px; margin: 8px auto;
  background: linear-gradient(180deg, #665, #443); color: #ff6; font-size: 1.2em;
  border: 2px solid #aa8; border-radius: 10px; cursor: pointer; text-align: center;
  font-family: 'Courier New', monospace; text-shadow: 1px 1px 0 #000;
  min-height: 48px;
}
.menu-btn:hover, .menu-btn:active { background: linear-gradient(180deg, #887, #554); border-color: #ff6; }
.hud-bar {
  position: absolute; top: 0; left: 0; width: 100%; padding: 6px 12px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,0,0,0.6); color: #fff; font-size: 13px; z-index: 20;
  flex-wrap: wrap; gap: 4px;
}
.hud-bar.hidden { display: none; }
.hud-section { display: flex; align-items: center; gap: 8px; }
.hud-label { color: #aaa; }
.hud-val { color: #ff6; font-weight: bold; }
.hp-bar-bg { width: 80px; height: 10px; background: #333; border: 1px solid #666; border-radius: 3px; overflow: hidden; }
.hp-bar-fill { height: 100%; transition: width 0.3s; }
.controls-bar {
  position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 12px;
  background: rgba(0,0,0,0.75); z-index: 20; display: flex;
  align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
}
.controls-bar.hidden { display: none; }
.ctrl-group { display: flex; align-items: center; gap: 6px; color: #ccc; font-size: 14px; }
.ctrl-group input[type=range] { width: 130px; height: 28px; accent-color: #f90; }
.fire-btn {
  padding: 16px 36px; background: linear-gradient(180deg, #d33, #900); color: #fff;
  border: 2px solid #f66; border-radius: 10px; font-size: 1.2em; cursor: pointer;
  font-family: 'Courier New', monospace; font-weight: bold;
  min-height: 48px; min-width: 100px;
}
.fire-btn:hover { background: linear-gradient(180deg, #f44, #b00); }
.fire-btn:disabled { opacity: 0.4; cursor: default; }
.weapon-btn {
  padding: 12px 18px; background: #335; color: #8cf; border: 1px solid #68a;
  border-radius: 6px; font-size: 14px; cursor: pointer; font-family: 'Courier New', monospace;
  min-height: 44px;
}
.weapon-btn:hover { background: #447; }
/* Shop overlay */
.shop-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.9); z-index: 200;
}
.shop-overlay.hidden { display: none; }
.shop-title { font-size: 1.8em; color: #ff6; margin-bottom: 10px; text-shadow: 2px 2px 0 #a30; }
.shop-coins { color: #fc0; font-size: 1.1em; margin-bottom: 15px; }
.shop-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 500px;
  max-height: 60vh; overflow-y: auto; padding: 8px;
}
.shop-item {
  background: #223; border: 1px solid #456; border-radius: 6px; padding: 14px;
  text-align: center; cursor: pointer; transition: border-color 0.2s;
  min-height: 48px;
}
.shop-item:hover { border-color: #ff6; }
.shop-item.owned { border-color: #0a0; }
.shop-item.locked { opacity: 0.4; cursor: not-allowed; }
.shop-item-name { color: #ff6; font-size: 1em; margin-bottom: 4px; }
.shop-item-price { color: #aaa; font-size: 0.9em; }
.shop-item-desc { color: #888; font-size: 0.8em; margin-top: 4px; }
.shop-item-lock { color: #f66; font-size: 0.75em; margin-top: 2px; }
.shop-done-btn {
  margin-top: 15px; padding: 16px 36px; background: #363; color: #6f6;
  border: 2px solid #6f6; border-radius: 8px; font-size: 1.1em; cursor: pointer;
  font-family: 'Courier New', monospace; min-height: 48px;
}
/* Campaign / AI select */
.ai-select { display: flex; gap: 10px; margin-top: 10px; }
.msg-box {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.85); border: 2px solid #ff6; border-radius: 10px;
  padding: 20px 30px; color: #ff6; font-size: 1.2em; text-align: center;
  z-index: 150; min-width: 200px;
}
.msg-box.hidden { display: none; }
.msg-box .sub { color: #aaa; font-size: 0.7em; margin-top: 8px; }
/* Volume control */
.vol-group { position: absolute; top: 36px; right: 10px; z-index: 25; display: flex; align-items: center; gap: 4px; color: #aaa; font-size: 11px; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 4px; }
.vol-group input[type=range] { width: 60px; height: 16px; accent-color: #f90; }
/* Floating damage numbers */
.dmg-float { position: absolute; pointer-events: none; font-weight: bold; font-family: 'Courier New', monospace; z-index: 30; text-shadow: 1px 1px 2px #000; animation: dmgUp 1.2s ease-out forwards; }
@keyframes dmgUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }
/* Kill streak */
.streak-announce { position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%); font-size: 2.5em; font-weight: bold; color: #f44; text-shadow: 0 0 20px #f00, 3px 3px 0 #000; z-index: 160; pointer-events: none; animation: streakPop 2s ease-out forwards; font-family: 'Courier New', monospace; }
@keyframes streakPop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); } 30% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1); } }
/* Victory screen */
.victory-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.9); z-index: 250;
}
.victory-overlay.hidden { display: none; }
.victory-title { font-size: 2.2em; margin-bottom: 15px; text-shadow: 3px 3px 0 #000; }
.victory-stats { color: #ccc; font-size: 1em; line-height: 1.8; text-align: center; margin-bottom: 20px; }
.victory-stats span { color: #ff6; }
/* Stats screen */
.stats-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.92); z-index: 200;
}
.stats-overlay.hidden { display: none; }
.stats-title { font-size: 1.8em; color: #ff6; margin-bottom: 15px; text-shadow: 2px 2px 0 #a30; }
.stats-body { color: #ccc; font-size: 1em; line-height: 2; text-align: center; }
.stats-body span { color: #ff6; font-weight: bold; }
.stats-close-btn {
  margin-top: 20px; padding: 14px 30px; background: #433; color: #f99;
  border: 2px solid #f66; border-radius: 8px; font-size: 1em; cursor: pointer;
  font-family: 'Courier New', monospace; min-height: 48px;
}
/* Biome selector */
.biome-select { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.biome-btn {
  padding: 8px 12px; background: #334; color: #8cf; border: 1px solid #568;
  border-radius: 6px; font-size: 12px; cursor: pointer; font-family: 'Courier New', monospace;
  min-height: 36px;
}
.biome-btn:hover, .biome-btn.active { background: #456; border-color: #ff6; color: #ff6; }
/* Level badge in menu */
.menu-level { color: #8cf; font-size: 0.9em; margin-bottom: 15px; }
/* Smoke overlay effect on canvas */
.smoke-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: rgba(80,80,80,0.7); transition: opacity 0.5s; }
.smoke-overlay.hidden { opacity: 0; pointer-events: none; }
/* Mobile-friendly: larger touch targets on small screens */
@media (max-width: 640px) {
  .ctrl-group input[type=range] { width: 100px; height: 32px; }
  .fire-btn { padding: 18px 28px; font-size: 1.3em; }
  .weapon-btn { padding: 14px 16px; font-size: 15px; }
  .controls-bar { padding: 12px 8px; gap: 10px; }
  .ctrl-group { font-size: 13px; }
  .hud-bar { font-size: 12px; padding: 8px 8px; }
  .hp-bar-bg { width: 60px; }
  .menu-btn { width: 90%; max-width: 300px; padding: 18px 24px; font-size: 1.2em; }
  .shop-grid { grid-template-columns: 1fr; max-width: 90%; }
  .biome-btn { font-size: 11px; padding: 6px 8px; }
}
@media (max-height: 480px) {
  .controls-bar { padding: 6px 8px; gap: 8px; }
  .fire-btn { padding: 12px 24px; }
  .ctrl-group input[type=range] { height: 24px; width: 80px; }
}
</style>
</head>

<script>
// ============================================================
// TANK BLASTER 2 — Complete Game Engine (Enhanced Edition)
// ============================================================

// --- Canvas Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resizeCanvas(); if (Game.state === 'playing') Game.render(); });
resizeCanvas();

// --- Audio Engine (Web Audio API, no files) ---
const Audio = (() => {
  let actx = null;
  let masterVol = 0.5;
  let masterGain = null;
  function ensure() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();
      masterGain.gain.value = masterVol;
      masterGain.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function getDest() { ensure(); return masterGain; }
  function noise(duration, freq, type, vol) {
    const a = ensure();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, a.currentTime);
    gain.gain.setValueAtTime(vol || 0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + duration);
    osc.connect(gain); gain.connect(getDest());
    osc.start(); osc.stop(a.currentTime + duration);
  }
  function explosion(big) {
    const a = ensure();
    const bufSize = a.sampleRate * (big ? 0.8 : 0.4);
    const buf = a.createBuffer(1, bufSize, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = a.createBufferSource();
    src.buffer = buf;
    const gain = a.createGain();
    gain.gain.setValueAtTime(big ? 0.5 : 0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (big ? 0.8 : 0.4));
    src.connect(gain); gain.connect(getDest());
    src.start();
  }
  return {
    setVolume(v) { masterVol = v; if (masterGain) masterGain.gain.value = v; },
    fire() { noise(0.15, 150, 'square', 0.4); noise(0.1, 80, 'sawtooth', 0.3); },
    explode(big) { explosion(big); },
    wind() { noise(0.6, 200, 'sine', 0.05); },
    thunder() { noise(0.5, 60, 'sawtooth', 0.5); setTimeout(() => noise(0.4, 40, 'square', 0.4), 100); },
    click() { noise(0.05, 800, 'square', 0.1); },
    win() { noise(0.2, 523, 'square', 0.2); setTimeout(() => noise(0.2, 659, 'square', 0.2), 200); setTimeout(() => noise(0.4, 784, 'square', 0.2), 400); },
    laser() { noise(0.3, 1200, 'sawtooth', 0.3); noise(0.2, 800, 'square', 0.2); },
    heal() { noise(0.15, 600, 'sine', 0.2); setTimeout(() => noise(0.15, 800, 'sine', 0.2), 150); setTimeout(() => noise(0.2, 1000, 'sine', 0.2), 300); },
    rumble() { noise(0.8, 40, 'sawtooth', 0.5); noise(0.6, 30, 'square', 0.4); },
    bounce() { noise(0.08, 400, 'square', 0.2); },
  };
})();

// Volume slider
document.getElementById('vol-slider').addEventListener('input', function() {
  Audio.setVolume(this.value / 100);
});

// Resume audio on first interaction
document.addEventListener('pointerdown', () => { try { Audio.click(); } catch(e){} }, { once: true });

    terrainTop: '#5a3a2a', terrainTopDark: '#4a2a1a', terrainEdge: '#6a4a3a',
    terrainGrad: [['#5a3020',0],['#4a2818',0.3],['#3a1810',1]],
    waterGrad: [['#ff4400',0],['#dd3300',0.3],['#bb2200',0.7],['#881100',1]],
    foam: '#ff6620', waterHighlight: 'rgba(255,100,0,0.3)', waterFoam: 'rgba(255,200,50,0.5)',
    sunColor: '#ff8844', sunGlowInner: 'rgba(255,100,30,0.8)', sunGlowOuter: 'rgba(255,50,0,0)',

    gravity: 0.08, treeName: null, particleColor: '#f80'
  },

// --- Progression System ---
const Progression = {
  data: null,
  xpPerLevel: 200,

  defaults() {
    return {
      xp: 0, level: 1,
      totalGames: 0, wins: 0, totalDamage: 0, totalKills: 0,
      weaponUses: {}, killStreakMax: 0,
      selectedBiome: 'tropical'
    };
  },

  load() {
    try {
      const raw = localStorage.getItem('tankblaster2_progress');
      if (raw) {
        this.data = { ...this.defaults(), ...JSON.parse(raw) };
      } else {
        this.data = this.defaults();
      }
    } catch(e) {
      this.data = this.defaults();
    }
  },

  save() {
    try { localStorage.setItem('tankblaster2_progress', JSON.stringify(this.data)); } catch(e) {}
  },

  addXP(amount) {
    this.data.xp += amount;
    const oldLevel = this.data.level;
    this.data.level = Math.floor(this.data.xp / this.xpPerLevel) + 1;
    this.save();
    return this.data.level > oldLevel;
  },

  isWeaponUnlocked(weaponKey) {
    const w = WEAPONS[weaponKey];
    return w && this.data.level >= w.unlockLevel;
  },

  recordGame(won, damageDealt, kills, weaponUsed) {
    this.data.totalGames++;
    if (won) this.data.wins++;
    this.data.totalDamage += damageDealt;
    this.data.totalKills += kills;
    if (weaponUsed) {
      this.data.weaponUses[weaponUsed] = (this.data.weaponUses[weaponUsed] || 0) + 1;
    }
    this.save();
  },

  favoriteWeapon() {
    let best = 'shell', max = 0;
    for (const [k, v] of Object.entries(this.data.weaponUses)) {
      if (v > max) { max = v; best = k; }
    }
    return WEAPONS[best] ? WEAPONS[best].name : 'Shell';
  }
};
Progression.load();

// --- Terrain ---
const Terrain = {
  data: null,
  palmTrees: [],
  huts: [],
  buildings: [],
  craters: [],

  generate(w, h, biome) {
    this.data = new Float32Array(w);
    const baseH = h * 0.45;
    const waterLine = h * 0.85;
    for (let i = 0; i < w; i++) this.data[i] = baseH;

    const seed = Math.random() * 1000;
    for (let i = 0; i < w; i++) {
      this.data[i] = baseH
        + Math.sin((i + seed) * 0.005) * h * 0.12
        + Math.sin((i + seed) * 0.013) * h * 0.06
        + Math.sin((i + seed) * 0.031) * h * 0.03
        + (Math.random() - 0.5) * 2;
    }
    // Smooth
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 1; i < w - 1; i++) {
        this.data[i] = (this.data[i-1] + this.data[i] + this.data[i+1]) / 3;
      }
    }
    // Space biome: add craters
    if (biome === 'space') {
      this.craters = [];
      for (let c = 0; c < 6; c++) {
        const cx = 80 + Math.random() * (w - 160);
        const cr = 20 + Math.random() * 40;
        this.craters.push({ x: cx, r: cr });
        for (let x = Math.floor(cx - cr); x <= Math.ceil(cx + cr); x++) {
          if (x < 0 || x >= w) continue;
          const dist = Math.abs(x - cx) / cr;
          const depth = Math.sqrt(Math.max(0, 1 - dist * dist)) * cr * 0.3;
          this.data[x] += depth;
          // rim
          if (dist > 0.8 && dist < 1.1) this.data[x] -= cr * 0.1;
        }
      }
    } else {
      this.craters = [];
    }
    // City biome: flatter terrain with building platforms
    if (biome === 'city') {
      // Flatten somewhat
      for (let pass = 0; pass < 10; pass++) {
        for (let i = 1; i < w - 1; i++) {
          this.data[i] = (this.data[i-1] + this.data[i] + this.data[i+1]) / 3;
        }
      }
    }
    // Clamp
    for (let i = 0; i < w; i++) {
      this.data[i] = Math.max(h * 0.2, Math.min(waterLine - 20, this.data[i]));
    }

    const b = BIOMES[biome] || BIOMES.tropical;

    // Generate trees/decorations
    this.palmTrees = [];
    if (b.hasTrees) {
      for (let i = 0; i < 8; i++) {
        const x = 50 + Math.random() * (w - 100);
        this.palmTrees.push({ x, alive: true });
      }
    }

    // Generate huts
    this.huts = [];
    if (b.hasHuts) {
      for (let i = 0; i < 3; i++) {
        const x = w * 0.2 + Math.random() * (w * 0.6);
        this.huts.push({ x, w: 20 + Math.random() * 10, h: 18 + Math.random() * 10, alive: true });
      }
    }

    // Buildings for city biome
    this.buildings = [];
    if (b.hasBuildings) {
      for (let i = 0; i < 5; i++) {
        const x = w * 0.1 + Math.random() * (w * 0.8);
        const bw = 30 + Math.random() * 20;
        const bh = 40 + Math.random() * 60;
        this.buildings.push({ x, w: bw, h: bh, alive: true, color: ['#556','#667','#778','#445'][Math.floor(Math.random()*4)] });
      }
    }
  },

  heightAt(x) {
    const ix = Math.floor(Math.max(0, Math.min(x, W - 1)));
    return this.data[ix] || H * 0.5;
  },

  crater(cx, cy, radius) {
    for (let x = Math.floor(cx - radius); x <= Math.ceil(cx + radius); x++) {
      if (x < 0 || x >= W) continue;
      const dy = Math.sqrt(Math.max(0, radius * radius - (x - cx) * (x - cx)));
      const terrainY = this.data[x];
      if (cy >= terrainY - radius) {
        const newY = Math.max(terrainY, cy + dy);
        this.data[x] = Math.min(H * 0.85, newY);
      }
    }
    this.palmTrees.forEach(t => {
      if (t.alive && Math.abs(t.x - cx) < radius) t.alive = false;
    });
    this.huts.forEach(h => {
      if (h.alive && Math.abs(h.x - cx) < radius + h.w) h.alive = false;
    });
    this.buildings.forEach(b => {
      if (b.alive && Math.abs(b.x - cx) < radius + b.w) b.alive = false;
    });
  },

  digBelow(x, depth) {
    const spread = 25;
    for (let dx = -spread; dx <= spread; dx++) {
      const ix = Math.floor(x + dx);
      if (ix < 0 || ix >= W) continue;
      const factor = 1 - Math.abs(dx) / spread;
      this.data[ix] = Math.min(H * 0.85, this.data[ix] + depth * factor);
    }
  },

  burnSurface(cx, spread) {
    for (let x = Math.floor(cx - spread); x <= Math.ceil(cx + spread); x++) {
      if (x < 0 || x >= W) continue;
      this.data[x] = Math.min(H * 0.85, this.data[x] + 5 + Math.random() * 5);
    }
  },

  shakeEarthquake() {
    for (let i = 0; i < W; i++) {
      this.data[i] += (Math.random() - 0.5) * 8;
      this.data[i] = Math.max(H * 0.2, Math.min(H * 0.85 - 20, this.data[i]));
    }
    // Smooth a bit
    for (let i = 1; i < W - 1; i++) {
      this.data[i] = (this.data[i-1] + this.data[i] + this.data[i+1]) / 3;
    }
  },

  draw(ctx, biomeKey) {
    const b = BIOMES[biomeKey] || BIOMES.tropical;
    // Terrain fill
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < W; x++) ctx.lineTo(x, this.data[x]);
    ctx.lineTo(W, H);
    ctx.closePath();

    const tGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
    b.terrainGrad.forEach(([c, s]) => tGrad.addColorStop(s, c));
    ctx.fillStyle = tGrad;
    ctx.fill();

    // Grass/top strip
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < W; x++) ctx.lineTo(x, this.data[x]);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.save();
    ctx.clip();
    for (let x = 0; x < W; x++) {
      const grassH = 8 + Math.sin(x * 0.1) * 2;
      const gy = this.data[x];
      ctx.fillStyle = b.terrainTop;
      ctx.fillRect(x, gy, 1, grassH);
      ctx.fillStyle = b.terrainTopDark;
      ctx.fillRect(x, gy, 1, 3);
    }
    ctx.restore();

    // Terrain top edge highlight
    ctx.beginPath();
    for (let x = 0; x < W; x += 2) ctx.lineTo(x, this.data[x]);
    ctx.strokeStyle = b.terrainEdge;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Trees/decorations
    this.palmTrees.forEach(t => {
      if (!t.alive) return;
      const tx = t.x, ty = this.data[Math.floor(tx)];
      if (b.treeName === 'palm') this.drawPalm(ctx, tx, ty, t);
      else if (b.treeName === 'cactus') this.drawCactus(ctx, tx, ty);
      else if (b.treeName === 'pine') this.drawPine(ctx, tx, ty);
      else if (b.treeName === 'lamp') this.drawLamp(ctx, tx, ty);
    });

    // Huts
    this.huts.forEach(h => {
      if (!h.alive) return;
      const hx = h.x, hy = this.data[Math.floor(hx)];
      const hw = h.w, hh = h.h;
      ctx.fillStyle = '#c9a96e';
      ctx.fillRect(hx - hw/2, hy - hh, hw, hh);
      ctx.strokeStyle = '#8a6e3a';
      ctx.lineWidth = 1;
      ctx.strokeRect(hx - hw/2, hy - hh, hw, hh);
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(hx - 3, hy - 10, 6, 10);
      ctx.beginPath();
      ctx.moveTo(hx - hw/2 - 5, hy - hh);
      ctx.lineTo(hx, hy - hh - 12);
      ctx.lineTo(hx + hw/2 + 5, hy - hh);
      ctx.closePath();
      ctx.fillStyle = b.hasSnow ? '#e8e8f0' : '#8a6a2a';
      ctx.fill();
      ctx.strokeStyle = '#6a4a1a';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.strokeStyle = '#a07a3a';
      ctx.lineWidth = 0.5;
      for (let s = -hw/2; s < hw/2; s += 4) {
        ctx.beginPath();
        ctx.moveTo(hx + s, hy - hh);
        ctx.lineTo(hx + s * 0.3, hy - hh - 10);
        ctx.stroke();
      }
    });

    // Buildings (city biome)
    this.buildings.forEach(bd => {
      if (!bd.alive) return;
      const bx = bd.x, by = this.data[Math.floor(bx)];
      ctx.fillStyle = bd.color;
      ctx.fillRect(bx - bd.w/2, by - bd.h, bd.w, bd.h);
      ctx.strokeStyle = '#334';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx - bd.w/2, by - bd.h, bd.w, bd.h);
      // Windows
      ctx.fillStyle = '#ffa';
      for (let wy = by - bd.h + 6; wy < by - 4; wy += 10) {
        for (let wx = bx - bd.w/2 + 5; wx < bx + bd.w/2 - 3; wx += 8) {
          ctx.fillRect(wx, wy, 4, 5);
        }
      }
    });
  },

  drawPalm(ctx, tx, ty, t) {
    const h = 55 + (t.x % 20);
    const lean = Math.sin(t.x * 0.3) * 10;
    const topX = tx + lean, topY = ty - h;
    ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + lean * 0.5, ty - h * 0.5, topX, topY); ctx.stroke();
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + lean * 0.5, ty - h * 0.5, topX, topY); ctx.stroke();
    ctx.strokeStyle = '#6b3a1b'; ctx.lineWidth = 1;
    for (let r = 0.2; r < 0.9; r += 0.15) {
      const rx = tx + lean * r, ry = ty - h * r;
      ctx.beginPath(); ctx.moveTo(rx - 3, ry); ctx.lineTo(rx + 3, ry); ctx.stroke();
    }
    for (let a = 0; a < 7; a++) {
      const angle = -Math.PI / 2 + (a - 3) * 0.45;
      const len = 30 + Math.random() * 10;
      const droop = 12;
      const endX = topX + Math.cos(angle) * len;
      const endY = topY + Math.sin(angle) * len + droop;
      const cpX = topX + Math.cos(angle) * len * 0.6;
      const cpY = topY + Math.sin(angle) * len * 0.3;
      ctx.strokeStyle = '#1a5a1a'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(topX, topY); ctx.quadraticCurveTo(cpX, cpY, endX, endY); ctx.stroke();
      ctx.strokeStyle = '#2d8a2d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(topX, topY); ctx.quadraticCurveTo(cpX, cpY, endX, endY); ctx.stroke();
    }
    ctx.fillStyle = '#6b3a1b';
    for (let c = 0; c < 3; c++) {
      const cx = topX - 4 + c * 4, cy = topY + 2 + c * 2;
      ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    }
  },

  drawCactus(ctx, tx, ty) {
    const h = 30 + (tx % 15);
    // Main body
    ctx.fillStyle = '#2a7a2a';
    ctx.fillRect(tx - 4, ty - h, 8, h);
    ctx.strokeStyle = '#1a5a1a'; ctx.lineWidth = 1;
    ctx.strokeRect(tx - 4, ty - h, 8, h);
    // Arms
    ctx.fillRect(tx - 12, ty - h * 0.6, 8, 5);
    ctx.fillRect(tx - 12, ty - h * 0.6 - 12, 5, 12);
    ctx.fillRect(tx + 4, ty - h * 0.4, 10, 5);
    ctx.fillRect(tx + 9, ty - h * 0.4 - 10, 5, 10);
  },

  drawPine(ctx, tx, ty) {
    const h = 45 + (tx % 20);
    // Trunk
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(tx - 3, ty - 12, 6, 12);
    // Snow-covered layers
    for (let i = 0; i < 4; i++) {
      const layerW = 22 - i * 4;
      const layerY = ty - 12 - i * (h / 5);
      ctx.beginPath();
      ctx.moveTo(tx - layerW, layerY);
      ctx.lineTo(tx, layerY - h / 5);
      ctx.lineTo(tx + layerW, layerY);
      ctx.closePath();
      ctx.fillStyle = '#2a6a2a';
      ctx.fill();
      // Snow on top
      ctx.beginPath();
      ctx.moveTo(tx - layerW + 3, layerY);
      ctx.lineTo(tx, layerY - h / 6);
      ctx.lineTo(tx + layerW - 3, layerY);
      ctx.closePath();
      ctx.fillStyle = 'rgba(230,230,245,0.5)';
      ctx.fill();
    }
  },

  drawLamp(ctx, tx, ty) {
    // Street lamp
    ctx.strokeStyle = '#444'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, ty - 40); ctx.stroke();
    // Arm
    ctx.beginPath(); ctx.moveTo(tx, ty - 40); ctx.lineTo(tx + 8, ty - 42); ctx.stroke();
    // Light
    ctx.fillStyle = '#ffa';
    ctx.beginPath(); ctx.arc(tx + 8, ty - 42, 4, 0, Math.PI * 2); ctx.fill();
    // Glow
    ctx.fillStyle = 'rgba(255,255,150,0.15)';
    ctx.beginPath(); ctx.arc(tx + 8, ty - 42, 20, 0, Math.PI * 2); ctx.fill();
  }
};

// --- Tank ---
class Tank {
  constructor(name, color, x, isAI, aiDiff) {
    this.name = name;
    this.color = color;
    this.x = x;
    this.y = 0;
    this.hp = 100;
    this.maxHp = 100;
    this.angle = 45;
    this.power = 50;
    this.coins = 200;
    this.isAI = isAI || false;
    this.aiDifficulty = aiDiff || 'medium';
    this.weapons = { shell: Infinity };
    this.currentWeapon = 'shell';
    this.shield = false;
    this.width = 28;
    this.height = 14;
    this.barrelLen = 20;
    this.facingRight = true;
    this.falling = false;
    this.smokeActive = false;
    // Match stats
    this.matchDamage = 0;
    this.matchKills = 0;
  }

  updateY() {
    this.y = Terrain.heightAt(this.x);
  }

  applyGravity() {
    const targetY = Terrain.heightAt(this.x);
    if (this.y < targetY) {
      this.y = Math.min(this.y + 3, targetY);
      return this.y < targetY;
    }
    return false;
  }

  draw(ctx, isActive) {
    const tx = this.x, ty = this.y;
    if (this.shield) {
      ctx.beginPath();
      ctx.arc(tx, ty - 10, 25, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,200,255,0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.fillStyle = this.color;
    ctx.fillRect(tx - this.width / 2, ty - this.height, this.width, this.height);
    ctx.beginPath();
    ctx.arc(tx, ty - this.height, 8, Math.PI, 0);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(tx - this.width / 2, ty - this.height, this.width, this.height);
    ctx.beginPath();
    ctx.arc(tx, ty - this.height, 8, Math.PI, 0);
    ctx.stroke();
    const radAngle = this.facingRight
      ? -this.angle * Math.PI / 180
      : -(180 - this.angle) * Math.PI / 180;
    const bx = tx + Math.cos(radAngle) * this.barrelLen;
    const by = ty - this.height + Math.sin(radAngle) * this.barrelLen;
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tx, ty - this.height);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.fillRect(tx - this.width / 2 - 2, ty - 3, this.width + 4, 4);
    const hpW = 30;
    const hpX = tx - hpW / 2;
    const hpY = ty - this.height - 22;
    ctx.fillStyle = '#333';
    ctx.fillRect(hpX, hpY, hpW, 5);
    ctx.fillStyle = this.hp > 50 ? '#4f4' : this.hp > 25 ? '#ff0' : '#f44';
    ctx.fillRect(hpX, hpY, hpW * (this.hp / this.maxHp), 5);
    ctx.fillStyle = '#fff';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, tx, hpY - 3);
    if (isActive) {
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.moveTo(tx, hpY - 14);
      ctx.lineTo(tx - 5, hpY - 8);
      ctx.lineTo(tx + 5, hpY - 8);
      ctx.fill();
    }
  }

  getBarrelTip() {
    const radAngle = this.facingRight
      ? -this.angle * Math.PI / 180
      : -(180 - this.angle) * Math.PI / 180;
    return {
      x: this.x + Math.cos(radAngle) * this.barrelLen,
      y: this.y - this.height + Math.sin(radAngle) * this.barrelLen
    };
  }
}

// --- Cloud Frederic ---
const Frederic = {
  x: 0, y: 0, targetX: 0, targetY: 0,
  angry: false, angryTimer: 0, phase: 0,

  init() {
    this.x = W * 0.5;
    this.y = H * 0.12;
    this.pickTarget();
  },

  pickTarget() {
    this.targetX = 100 + Math.random() * (W - 200);
    this.targetY = 40 + Math.random() * (H * 0.15);
  },

  update(dt) {
    this.phase += dt * 0.5;
    this.x += (this.targetX - this.x) * 0.005;
    this.y += (this.targetY - this.y) * 0.005;
    this.y += Math.sin(this.phase) * 0.3;
    if (Math.abs(this.x - this.targetX) < 30) this.pickTarget();
    if (this.angryTimer > 0) {
      this.angryTimer -= dt;
      if (this.angryTimer <= 0) this.angry = false;
    }
  },

  makeAngry() {
    this.angry = true;
    this.angryTimer = 3;
  },

  draw(ctx) {
    const cx = this.x, cy = this.y;
    const breathe = Math.sin(this.phase * 2) * 2;
    const scale = this.angry ? 1.15 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 45 + breathe, 35 * scale, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    const baseColor = this.angry ? '#555' : '#dde';
    const darkColor = this.angry ? '#3a3a3a' : '#bbc';
    const puffs = [
      [0, 0, 32 * scale], [-24, 5, 24 * scale], [24, 5, 24 * scale],
      [-12, -14, 20 * scale], [12, -14, 20 * scale], [0, 10, 22 * scale],
      [-18, -4, 16 * scale], [18, -4, 16 * scale]
    ];
    ctx.fillStyle = darkColor;
    puffs.forEach(([dx, dy, r]) => {
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy + breathe, r + 2, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = baseColor;
    puffs.forEach(([dx, dy, r]) => {
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy + breathe, r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = this.angry ? '#777' : '#eef';
    [[-10, -14, 14 * scale], [10, -14, 14 * scale], [0, -6, 18 * scale]].forEach(([dx, dy, r]) => {
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy + breathe - 3, r, 0, Math.PI * 2);
      ctx.fill();
    });
    const faceY = cy + 2 + breathe;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 11, faceY - 5, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 11, faceY - 5, 7, 0, Math.PI * 2); ctx.fill();
    const pupilOff = this.angry ? Math.sin(this.phase) * 2 : 0;
    ctx.fillStyle = this.angry ? '#c00' : '#222';
    ctx.beginPath(); ctx.arc(cx - 11 + pupilOff, faceY - 4, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 11 + pupilOff, faceY - 4, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 13, faceY - 7, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 9, faceY - 7, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = this.angry ? 3 : 2;
    if (this.angry) {
      ctx.beginPath(); ctx.moveTo(cx - 18, faceY - 16); ctx.lineTo(cx - 5, faceY - 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 18, faceY - 16); ctx.lineTo(cx + 5, faceY - 10); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(cx - 17, faceY - 13); ctx.lineTo(cx - 5, faceY - 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 17, faceY - 13); ctx.lineTo(cx + 5, faceY - 14); ctx.stroke();
    }
    ctx.beginPath();
    if (this.angry) {
      ctx.moveTo(cx - 10, faceY + 8);
      ctx.quadraticCurveTo(cx, faceY + 1, cx + 10, faceY + 8);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      for (let t = -6; t <= 6; t += 4) {
        ctx.fillRect(cx + t - 1, faceY + 4, 3, 3);
      }
    } else {
      ctx.moveTo(cx - 7, faceY + 6);
      ctx.quadraticCurveTo(cx, faceY + 4, cx + 7, faceY + 6);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (this.angry) {
      ctx.fillStyle = 'rgba(200,50,50,0.3)';
      ctx.beginPath(); ctx.arc(cx - 20, faceY + 2, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 20, faceY + 2, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = this.angry ? '#f44' : '#556';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('Frederic', cx, cy - 36 + breathe);
  }
};

// --- Particles / Effects ---
const Particles = {
  list: [],

  add(x, y, count, color, speed, life) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const sp = (0.5 + Math.random()) * (speed || 3);
      this.list.push({
        x, y, vx: Math.cos(angle) * sp, vy: Math.sin(angle) * sp - 1,
        life: (life || 1) * (0.5 + Math.random() * 0.5),
        maxLife: life || 1, color: color || '#ff0', size: 2 + Math.random() * 3
      });
    }
  },

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy += 0.05;
      p.life -= dt;
      if (p.life <= 0) this.list.splice(i, 1);
    }
  },

  draw(ctx) {
    this.list.forEach(p => {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }
};

// --- Explosion Effect ---
const Explosions = {
  list: [],

  add(x, y, radius) {
    this.list.push({ x, y, radius, time: 0, maxTime: 0.5 });
  },

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      this.list[i].time += dt;
      if (this.list[i].time >= this.list[i].maxTime) this.list.splice(i, 1);
    }
  },

  draw(ctx) {
    this.list.forEach(e => {
      const t = e.time / e.maxTime;
      const r = e.radius * (0.3 + t * 0.7);
      const alpha = 1 - t;
      ctx.beginPath();
      ctx.arc(e.x, e.y, r * 1.3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,100,0,${alpha * 0.3})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,200,50,${alpha * 0.7})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x, e.y, r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,200,${alpha})`;
      ctx.fill();
    });
  }
};

// --- Kill Streak ---
const KillStreak = {
  count: 0,
  lastKiller: null,

  reset() { this.count = 0; this.lastKiller = null; },

  recordKill(killer) {
    if (this.lastKiller === killer) {
      this.count++;
    } else {
      this.count = 1;
      this.lastKiller = killer;
    }
    if (this.count > (Progression.data.killStreakMax || 0)) {
      Progression.data.killStreakMax = this.count;
      Progression.save();
    }
    if (this.count >= 2) this.announce(this.count);
  },

  announce(count) {
    const names = { 2: 'DOUBLE KILL!', 3: 'TRIPLE KILL!', 4: 'MEGA KILL!', 5: 'UNSTOPPABLE!' };
    const text = names[Math.min(count, 5)] || ('GODLIKE! x' + count);
    const el = document.createElement('div');
    el.className = 'streak-announce';
    el.textContent = text;
    document.getElementById('ui-overlay').appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
};

// --- Projectile ---
const Projectile = {
  active: false,
  x: 0, y: 0, vx: 0, vy: 0,
  trail: [],
  type: 'shell',
  drillDepth: 0,
  drilling: false,
  bounces: 0,
  homingTarget: null,

  launch(x, y, angle, power, wind, type, target) {
    this.active = true;
    this.type = type || 'shell';
    this.drilling = false;
    this.drillDepth = 0;
    this.bounces = 0;
    this.homingTarget = target || null;
    const rad = -angle * Math.PI / 180;
    const speed = power * 0.18;
    this.x = x; this.y = y;
    this.vx = Math.cos(rad) * speed;
    this.vy = Math.sin(rad) * speed;
    this.trail = [{ x, y }];
    Audio.fire();
  },

  update(dt, wind, tanks, gravity) {
    if (!this.active) return null;
    const grav = gravity || 0.08;
    const steps = 3;
    for (let s = 0; s < steps; s++) {
      this.vy += grav;
      this.vx += wind * 0.0005;

      // Homing behavior
      if (this.type === 'homing' && this.homingTarget && this.homingTarget.hp > 0) {
        const dx = this.homingTarget.x - this.x;
        const dy = (this.homingTarget.y - this.homingTarget.height / 2) - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          const strength = 0.015;
          this.vx += (dx / dist) * strength;
          this.vy += (dy / dist) * strength;
        }
      }

      this.x += this.vx;
      this.y += this.vy;
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 300) this.trail.shift();

      // Off screen
      if (this.x < -50 || this.x > W + 50 || this.y > H + 50) {
        this.active = false;
        return { type: 'miss' };
      }

      // Drill bomb
      if (this.type === 'drill' && this.y >= Terrain.heightAt(this.x)) {
        if (!this.drilling) this.drilling = true;
        this.drillDepth++;
        if (this.drillDepth > 40) {
          this.active = false;
          return { type: 'hit', x: this.x, y: this.y, weapon: this.type };
        }
        continue;
      }

      // Bouncing bomb
      if (this.type === 'bouncing' && this.y >= Terrain.heightAt(this.x) && this.bounces < 3) {
        this.bounces++;
        this.vy = -Math.abs(this.vy) * 0.6;
        this.y = Terrain.heightAt(this.x) - 1;
        Audio.bounce();
        Particles.add(this.x, this.y, 5, '#ff0', 2, 0.3);
        continue;
      }

      // Terrain collision
      if (this.y >= Terrain.heightAt(this.x) && !this.drilling) {
        this.active = false;
        if (this.type === 'cluster') {
          return { type: 'cluster', x: this.x, y: this.y };
        }
        return { type: 'hit', x: this.x, y: this.y, weapon: this.type };
      }

      // Frederic blocks
      if (Frederic.blocking) {
        const dx = this.x - Frederic.x, dy = this.y - Frederic.y;
        if (dx * dx + dy * dy < 900) {
          this.active = false;
          Frederic.blocking = false;
          return { type: 'blocked' };
        }
      }

      // Direct tank hit
      for (const tank of tanks) {
        if (tank.hp <= 0) continue;
        const dx = this.x - tank.x;
        const dy = this.y - (tank.y - tank.height / 2);
        if (Math.abs(dx) < tank.width / 2 + 3 && Math.abs(dy) < tank.height / 2 + 5) {
          this.active = false;
          if (this.type === 'cluster') {
            return { type: 'cluster', x: this.x, y: this.y };
          }
          return { type: 'hit', x: this.x, y: this.y, weapon: this.type, directHit: tank };
        }
      }
    }
    return null;
  },

  draw(ctx) {
    if (this.trail.length > 1) {
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(255,255,100,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (this.active) {
      let color = '#ff0';
      if (this.type === 'napalm') color = '#f80';
      else if (this.type === 'nuke') color = '#f0f';
      else if (this.type === 'homing') color = '#f44';
      else if (this.type === 'bouncing') color = '#0ff';
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.type === 'nuke' ? 5 : this.type === 'homing' ? 4 : 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
};

// --- Airstrike ---
const Airstrike = {
  active: false,
  x: 0, y: 0, targetX: 0, bombs: [], bombTimer: 0,
  dropped: 0,

  start(targetX) {
    this.active = true;
    this.x = -50;
    this.y = H * 0.1;
    this.targetX = targetX;
    this.bombs = [];
    this.bombTimer = 0;
    this.dropped = 0;
  },

  update(dt) {
    if (!this.active) return [];
    this.x += 4;
    const results = [];

    if (this.x > this.targetX - 80 && this.x < this.targetX + 80) {
      this.bombTimer += dt;
      if (this.bombTimer > 0.15 && this.dropped < 5) {
        this.bombs.push({ x: this.x, y: this.y + 20, vy: 0 });
        this.bombTimer = 0;
        this.dropped++;
      }
    }

    for (let i = this.bombs.length - 1; i >= 0; i--) {
      const b = this.bombs[i];
      b.vy += 0.15;
      b.y += b.vy;
      if (b.y >= Terrain.heightAt(b.x)) {
        results.push({ type: 'hit', x: b.x, y: b.y, weapon: 'airstrike' });
        this.bombs.splice(i, 1);
      }
    }

    if (this.x > W + 60 && this.bombs.length === 0) {
      this.active = false;
    }
    return results;
  },

  draw(ctx) {
    if (!this.active) return;
    ctx.fillStyle = '#556';
    ctx.beginPath();
    ctx.moveTo(this.x + 20, this.y);
    ctx.lineTo(this.x - 15, this.y - 5);
    ctx.lineTo(this.x - 20, this.y);
    ctx.lineTo(this.x - 15, this.y + 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#667';
    ctx.fillRect(this.x - 5, this.y - 12, 10, 24);
    this.bombs.forEach(b => {
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, 3, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }
};

// --- Meteor Shower ---
const MeteorShower = {
  active: false,
  meteors: [],
  spawnTimer: 0,
  spawned: 0,
  maxMeteors: 8,

  start() {
    this.active = true;
    this.meteors = [];
    this.spawnTimer = 0;
    this.spawned = 0;
  },

  update(dt) {
    if (!this.active) return [];
    const results = [];

    this.spawnTimer += dt;
    if (this.spawnTimer > 0.2 && this.spawned < this.maxMeteors) {
      const x = 50 + Math.random() * (W - 100);
      this.meteors.push({ x, y: -20, vx: (Math.random() - 0.5) * 2, vy: 3 + Math.random() * 2 });
      this.spawnTimer = 0;
      this.spawned++;
    }

    for (let i = this.meteors.length - 1; i >= 0; i--) {
      const m = this.meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      m.vy += 0.1;
      // Trail
      Particles.add(m.x, m.y, 1, '#f80', 1, 0.3);
      if (m.y >= Terrain.heightAt(m.x)) {
        results.push({ type: 'hit', x: m.x, y: m.y, weapon: 'meteor' });
        this.meteors.splice(i, 1);
      }
    }

    if (this.spawned >= this.maxMeteors && this.meteors.length === 0) {
      this.active = false;
    }
    return results;
  },

  draw(ctx) {
    this.meteors.forEach(m => {
      ctx.fillStyle = '#f80';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });
  }
};

// --- Laser Beam Effect ---
const LaserBeam = {
  active: false,
  startX: 0, startY: 0, endX: 0, endY: 0,
  timer: 0, hitTarget: null,

  fire(sx, sy, angle, facingRight, tanks) {
    this.active = true;
    this.timer = 0.5;
    this.startX = sx;
    this.startY = sy;
    this.hitTarget = null;
    Audio.laser();

    const rad = facingRight ? -angle * Math.PI / 180 : -(180 - angle) * Math.PI / 180;
    const dx = Math.cos(rad);
    const dy = Math.sin(rad);

    // Ray march
    let x = sx, y = sy;
    for (let i = 0; i < 2000; i++) {
      x += dx * 2;
      y += dy * 2;
      if (x < 0 || x > W || y > H || y < -50) break;

      // Check terrain
      if (y >= Terrain.heightAt(x)) {
        this.endX = x;
        this.endY = y;
        return { type: 'hit', x, y, weapon: 'laser' };
      }

      // Check tanks
      for (const tank of tanks) {
        if (tank.hp <= 0) continue;
        const tdx = x - tank.x;
        const tdy = y - (tank.y - tank.height / 2);
        if (Math.abs(tdx) < tank.width / 2 + 3 && Math.abs(tdy) < tank.height / 2 + 5) {
          this.endX = x;
          this.endY = y;
          this.hitTarget = tank;
          return { type: 'hit', x, y, weapon: 'laser', directHit: tank };
        }
      }
    }
    this.endX = x;
    this.endY = y;
    return { type: 'miss' };
  },

  update(dt) {
    if (!this.active) return;
    this.timer -= dt;
    if (this.timer <= 0) this.active = false;
  },

  draw(ctx) {
    if (!this.active) return;
    const alpha = Math.max(0, this.timer / 0.5);
    // Outer glow
    ctx.strokeStyle = `rgba(255,50,50,${alpha * 0.4})`;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(this.startX, this.startY);
    ctx.lineTo(this.endX, this.endY);
    ctx.stroke();
    // Core beam
    ctx.strokeStyle = `rgba(255,200,200,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.startX, this.startY);
    ctx.lineTo(this.endX, this.endY);
    ctx.stroke();
  }
};

// --- Lightning Effect ---
const Lightning = {
  bolts: [],

  strike(x, groundY) {
    const points = [{ x, y: 0 }];
    let cy = 0;
    while (cy < groundY) {
      cy += 10 + Math.random() * 20;
      x += (Math.random() - 0.5) * 30;
      points.push({ x, y: Math.min(cy, groundY) });
    }
    this.bolts.push({ points, life: 0.5 });
    Audio.thunder();
  },

  update(dt) {
    for (let i = this.bolts.length - 1; i >= 0; i--) {
      this.bolts[i].life -= dt;
      if (this.bolts[i].life <= 0) this.bolts.splice(i, 1);
    }
  },

  draw(ctx) {
    this.bolts.forEach(b => {
      const alpha = Math.max(0, b.life / 0.5);
      ctx.strokeStyle = `rgba(200,200,255,${alpha})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#88f';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      b.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      b.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
  }
};

// --- Stars for space biome ---
const Stars = {
  list: [],
  generated: false,

  generate() {
    this.list = [];
    for (let i = 0; i < 200; i++) {
      this.list.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.85,
        size: 0.5 + Math.random() * 2,
        twinkle: Math.random() * Math.PI * 2
      });
    }
    this.generated = true;
  },

  draw(ctx, time) {
    this.list.forEach(s => {
      const alpha = 0.5 + Math.sin(time * 2 + s.twinkle) * 0.4;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
  }
};

// --- Biome-specific ambient particles ---
const AmbientParticles = {
  list: [],

  generate(biome) {
    this.list = [];
    if (biome === 'winter') {
      for (let i = 0; i < 60; i++) {
        this.list.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.5, vy: 0.3 + Math.random() * 0.5,
          size: 1 + Math.random() * 3, color: '#fff'
        });
      }
    } else if (biome === 'volcanic') {
      for (let i = 0; i < 30; i++) {
        this.list.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3, vy: -0.2 - Math.random() * 0.3,
          size: 1 + Math.random() * 2, color: '#888'
        });
      }
    }
  },

  update(dt) {
    this.list.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y > H) { p.y = -5; p.x = Math.random() * W; }
      if (p.y < -10) { p.y = H + 5; p.x = Math.random() * W; }
      if (p.x < -5) p.x = W + 5;
      if (p.x > W + 5) p.x = -5;
    });
  },

  draw(ctx) {
    this.list.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.6;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }
};

// --- Main Game Controller ---
const Game = {
  state: 'menu',
  mode: 'quick',
  tanks: [],
  turnIndex: 0,
  wind: 0,
  roundNum: 1,
  maxRounds: 1,
  campaignLevel: 1,
  lastTrail: [],
  cloudEvent: null,
  cloudEventTimer: 0,
  animCallback: null,
  gravityChecking: false,
  currentBiome: Progression.data.selectedBiome || 'tropical',
  matchWeaponUses: {},

  selectBiome(biome) {
    this.currentBiome = biome;
    Progression.data.selectedBiome = biome;
    Progression.save();
    // Update biome buttons
    document.querySelectorAll('.biome-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.biome-btn[onclick*="${biome}"]`).classList.add('active');

    Terrain.generate(W, H, biome);

  },

  // --- Menu ---
  showMenu() {
    this.state = 'menu';
    document.getElementById('menu-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('ai-select').style.display = 'none';
    document.getElementById('victory-screen').classList.add('hidden');
    this.hideMsg();
    // Show level
    document.getElementById('menu-level').textContent =
      'Level ' + Progression.data.level + ' | XP: ' + Progression.data.xp +

    document.querySelectorAll('.biome-btn').forEach(btn => btn.classList.remove('active'));
