<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tank Blaster 2: The Crazy Artillery Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; user-select: none; }
canvas { display: block; }
#ui-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#ui-overlay > * { pointer-events: auto; }
.screen-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85); z-index: 100;
}
.screen-overlay.hidden { display: none; }
.menu-title {
  font-size: 2.5em; color: #ff6; text-shadow: 3px 3px 0 #a30, 0 0 20px #f80;
  margin-bottom: 10px; text-align: center;
}
.menu-subtitle { font-size: 1em; color: #f90; margin-bottom: 30px; text-align: center; }
.menu-btn {
  display: block; width: 280px; padding: 16px 24px; margin: 8px auto;
  background: linear-gradient(180deg, #665, #443); color: #ff6; font-size: 1.2em;
  border: 2px solid #aa8; border-radius: 10px; cursor: pointer; text-align: center;
  font-family: 'Courier New', monospace; text-shadow: 1px 1px 0 #000;
  min-height: 48px;
}
.menu-btn:hover, .menu-btn:active { background: linear-gradient(180deg, #887, #554); border-color: #ff6; }
.hud-bar {
  position: absolute; top: 0; left: 0; width: 100%; padding: 6px 12px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,0,0,0.6); color: #fff; font-size: 13px; z-index: 20;
  flex-wrap: wrap; gap: 4px;
}
.hud-bar.hidden { display: none; }
.hud-section { display: flex; align-items: center; gap: 8px; }
.hud-label { color: #aaa; }
.hud-val { color: #ff6; font-weight: bold; }
.hp-bar-bg { width: 80px; height: 10px; background: #333; border: 1px solid #666; border-radius: 3px; overflow: hidden; }
.hp-bar-fill { height: 100%; transition: width 0.3s; }
.controls-bar {
  position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 12px;
  background: rgba(0,0,0,0.75); z-index: 20; display: flex;
  align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
}
.controls-bar.hidden { display: none; }
.ctrl-group { display: flex; align-items: center; gap: 6px; color: #ccc; font-size: 14px; }
.ctrl-group input[type=range] { width: 130px; height: 28px; accent-color: #f90; }
.fire-btn {
  padding: 16px 36px; background: linear-gradient(180deg, #d33, #900); color: #fff;
  border: 2px solid #f66; border-radius: 10px; font-size: 1.2em; cursor: pointer;
  font-family: 'Courier New', monospace; font-weight: bold;
  min-height: 48px; min-width: 100px;
}
.fire-btn:hover { background: linear-gradient(180deg, #f44, #b00); }
.fire-btn:disabled { opacity: 0.4; cursor: default; }
.weapon-btn {
  padding: 12px 18px; background: #335; color: #8cf; border: 1px solid #68a;
  border-radius: 6px; font-size: 14px; cursor: pointer; font-family: 'Courier New', monospace;
  min-height: 44px;
}
.weapon-btn:hover { background: #447; }
/* Shop overlay */
.shop-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.9); z-index: 200;
}
.shop-overlay.hidden { display: none; }
.shop-title { font-size: 1.8em; color: #ff6; margin-bottom: 10px; text-shadow: 2px 2px 0 #a30; }
.shop-coins { color: #fc0; font-size: 1.1em; margin-bottom: 15px; }
.shop-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 500px;
  max-height: 60vh; overflow-y: auto; padding: 8px;
}
.shop-item {
  background: #223; border: 1px solid #456; border-radius: 6px; padding: 14px;
  text-align: center; cursor: pointer; transition: border-color 0.2s;
  min-height: 48px;
}
.shop-item:hover { border-color: #ff6; }
.shop-item.owned { border-color: #0a0; }
.shop-item-name { color: #ff6; font-size: 1em; margin-bottom: 4px; }
.shop-item-price { color: #aaa; font-size: 0.9em; }
.shop-item-desc { color: #888; font-size: 0.8em; margin-top: 4px; }
.shop-done-btn {
  margin-top: 15px; padding: 16px 36px; background: #363; color: #6f6;
  border: 2px solid #6f6; border-radius: 8px; font-size: 1.1em; cursor: pointer;
  font-family: 'Courier New', monospace; min-height: 48px;
}
/* Campaign / AI select */
.ai-select { display: flex; gap: 10px; margin-top: 10px; }
.msg-box {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.85); border: 2px solid #ff6; border-radius: 10px;
  padding: 20px 30px; color: #ff6; font-size: 1.2em; text-align: center;
  z-index: 150; min-width: 200px;
}
.msg-box.hidden { display: none; }
.msg-box .sub { color: #aaa; font-size: 0.7em; margin-top: 8px; }
/* Mobile-friendly: larger touch targets on small screens */
@media (max-width: 640px) {
  .ctrl-group input[type=range] { width: 100px; height: 32px; }
  .fire-btn { padding: 18px 28px; font-size: 1.3em; }
  .weapon-btn { padding: 14px 16px; font-size: 15px; }
  .controls-bar { padding: 12px 8px; gap: 10px; }
  .ctrl-group { font-size: 13px; }
  .hud-bar { font-size: 12px; padding: 8px 8px; }
  .hp-bar-bg { width: 60px; }
  .menu-btn { width: 90%; max-width: 300px; padding: 18px 24px; font-size: 1.2em; }
  .shop-grid { grid-template-columns: 1fr; max-width: 90%; }
}
@media (max-height: 480px) {
  .controls-bar { padding: 6px 8px; gap: 8px; }
  .fire-btn { padding: 12px 24px; }
  .ctrl-group input[type=range] { height: 24px; width: 80px; }
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-overlay">
  <!-- Main Menu -->
  <div id="menu-screen" class="screen-overlay">
    <div class="menu-title">TANK BLASTER 2</div>
    <div class="menu-subtitle">The Crazy Artillery Game</div>
    <button class="menu-btn" onclick="Game.startQuickMatch()">Quick Match (2P Local)</button>
    <button class="menu-btn" onclick="Game.showAISelect()">Vs AI</button>
    <button class="menu-btn" onclick="Game.startCampaign()">Campaign (10 Levels)</button>
    <div id="ai-select" class="ai-select" style="display:none;">
      <button class="menu-btn" style="width:auto;padding:10px 16px" onclick="Game.startVsAI('easy')">Easy</button>
      <button class="menu-btn" style="width:auto;padding:10px 16px" onclick="Game.startVsAI('medium')">Medium</button>
      <button class="menu-btn" style="width:auto;padding:10px 16px" onclick="Game.startVsAI('hard')">Hard</button>
    </div>
  </div>
  <!-- HUD -->
  <div id="hud" class="hud-bar hidden">
    <div class="hud-section">
      <span id="hud-turn" class="hud-val">Player 1</span>
      <span class="hud-label">HP:</span>
      <div class="hp-bar-bg"><div id="hud-hp1" class="hp-bar-fill" style="width:100%;background:#4f4"></div></div>
      <div class="hp-bar-bg"><div id="hud-hp2" class="hp-bar-fill" style="width:100%;background:#f44"></div></div>
    </div>
    <div class="hud-section">
      <span class="hud-label">Wind:</span><span id="hud-wind" class="hud-val">0</span>
      <span class="hud-label">Weapon:</span><span id="hud-weapon" class="hud-val">Shell</span>
    </div>
    <div class="hud-section">
      <span class="hud-label">Coins:</span><span id="hud-coins" class="hud-val">0</span>
    </div>
  </div>
  <!-- Controls -->
  <div id="controls" class="controls-bar hidden">
    <div class="ctrl-group">
      <span>Angle:</span>
      <input type="range" id="ctrl-angle" min="0" max="180" value="45">
      <span id="ctrl-angle-val">45°</span>
    </div>
    <div class="ctrl-group">
      <span>Power:</span>
      <input type="range" id="ctrl-power" min="5" max="100" value="50">
      <span id="ctrl-power-val">50%</span>
    </div>
    <button class="weapon-btn" id="weapon-cycle" onclick="Game.cycleWeapon()">Shell ∞</button>
    <button class="fire-btn" id="fire-btn" onclick="Game.fire()">FIRE!</button>
  </div>
  <!-- Message box -->
  <div id="msg-box" class="msg-box hidden"></div>
  <!-- Shop -->
  <div id="shop-screen" class="shop-overlay hidden">
    <div class="shop-title">⚔ WEAPONS SHOP ⚔</div>
    <div id="shop-coins" class="shop-coins">Coins: 0</div>
    <div id="shop-grid" class="shop-grid"></div>
    <button class="shop-done-btn" onclick="Game.closeShop()">READY FOR BATTLE!</button>
  </div>
</div>

<script>
// ============================================================
// TANK BLASTER 2 — Complete Game Engine
// ============================================================

// --- Canvas Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resizeCanvas(); if (Game.state === 'playing') Game.render(); });
resizeCanvas();

// --- Audio Engine (Web Audio API, no files) ---
const Audio = (() => {
  let actx = null;
  function ensure() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function noise(duration, freq, type, vol) {
    const a = ensure();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, a.currentTime);
    gain.gain.setValueAtTime(vol || 0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + duration);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(); osc.stop(a.currentTime + duration);
  }
  function explosion(big) {
    const a = ensure();
    const bufSize = a.sampleRate * (big ? 0.8 : 0.4);
    const buf = a.createBuffer(1, bufSize, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = a.createBufferSource();
    src.buffer = buf;
    const gain = a.createGain();
    gain.gain.setValueAtTime(big ? 0.5 : 0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (big ? 0.8 : 0.4));
    src.connect(gain); gain.connect(a.destination);
    src.start();
  }
  return {
    fire() { noise(0.15, 150, 'square', 0.4); noise(0.1, 80, 'sawtooth', 0.3); },
    explode(big) { explosion(big); },
    wind() { noise(0.6, 200, 'sine', 0.05); },
    thunder() { noise(0.5, 60, 'sawtooth', 0.5); setTimeout(() => noise(0.4, 40, 'square', 0.4), 100); },
    click() { noise(0.05, 800, 'square', 0.1); },
    win() { noise(0.2, 523, 'square', 0.2); setTimeout(() => noise(0.2, 659, 'square', 0.2), 200); setTimeout(() => noise(0.4, 784, 'square', 0.2), 400); },
  };
})();

// Resume audio on first interaction
document.addEventListener('pointerdown', () => { try { Audio.click(); } catch(e){} }, { once: true });

// --- Weapon Definitions ---
const WEAPONS = {
  shell:    { name: 'Shell',       price: 0,    damage: 25, radius: 30, desc: 'Basic shot', icon: '●' },
  heavy:    { name: 'Heavy Shell', price: 100,  damage: 40, radius: 45, desc: 'More damage, bigger boom', icon: '◉' },
  cluster:  { name: 'Cluster Bomb',price: 200,  damage: 15, radius: 20, desc: 'Splits into 5 mini-bombs', icon: '✸' },
  napalm:   { name: 'Napalm',     price: 150,  damage: 10, radius: 15, desc: 'Burns along terrain', icon: '🔥' },
  drill:    { name: 'Drill Bomb', price: 120,  damage: 30, radius: 25, desc: 'Penetrates terrain', icon: '⬇' },
  shield:   { name: 'Shield',     price: 100,  damage: 0,  radius: 0,  desc: 'Blocks one hit', icon: '🛡' },
  teleport: { name: 'Teleport',   price: 100,  damage: 0,  radius: 0,  desc: 'Move to random spot', icon: '⚡' },
  airstrike:{ name: 'Airstrike',  price: 200,  damage: 20, radius: 25, desc: 'Plane drops bombs', icon: '✈' },
  nuke:     { name: 'MEGA NUKE',  price: 500,  damage: 80, radius: 100,desc: 'Massive explosion!', icon: '☢' },
};

// --- Terrain ---
const Terrain = {
  data: null, // Uint8Array heightmap (height at each x pixel)
  palmTrees: [],

  huts: [],

  generate(w, h) {
    this.data = new Float32Array(w);
    // Midpoint displacement for hilly terrain
    const baseH = h * 0.45;
    const waterLine = h * 0.85;
    for (let i = 0; i < w; i++) this.data[i] = baseH;

    // Multiple sine waves for interesting terrain
    const seed = Math.random() * 1000;
    for (let i = 0; i < w; i++) {
      this.data[i] = baseH
        + Math.sin((i + seed) * 0.005) * h * 0.12
        + Math.sin((i + seed) * 0.013) * h * 0.06
        + Math.sin((i + seed) * 0.031) * h * 0.03
        + (Math.random() - 0.5) * 2;
    }
    // Smooth
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 1; i < w - 1; i++) {
        this.data[i] = (this.data[i-1] + this.data[i] + this.data[i+1]) / 3;
      }
    }
    // Clamp
    for (let i = 0; i < w; i++) {
      this.data[i] = Math.max(h * 0.2, Math.min(waterLine - 20, this.data[i]));
    }

    // Generate palm trees
    this.palmTrees = [];
    for (let i = 0; i < 8; i++) {
      const x = 50 + Math.random() * (w - 100);
      this.palmTrees.push({ x, alive: true });
    }

    // Generate huts (2-3 small destructible buildings)
    this.huts = [];
    for (let i = 0; i < 3; i++) {
      const x = w * 0.2 + Math.random() * (w * 0.6);
      this.huts.push({ x, w: 20 + Math.random() * 10, h: 18 + Math.random() * 10, alive: true });
    }
  },

  heightAt(x) {
    const ix = Math.floor(Math.max(0, Math.min(x, W - 1)));
    return this.data[ix] || H * 0.5;
  },

  // Destroy terrain in a circle
  crater(cx, cy, radius) {
    for (let x = Math.floor(cx - radius); x <= Math.ceil(cx + radius); x++) {
      if (x < 0 || x >= W) continue;
      const dy = Math.sqrt(Math.max(0, radius * radius - (x - cx) * (x - cx)));
      const terrainY = this.data[x];
      // If explosion center is at or below terrain, dig into it
      if (cy >= terrainY - radius) {
        const newY = Math.max(terrainY, cy + dy);
        this.data[x] = Math.min(H * 0.85, newY);
      }
    }
    // Destroy nearby palm trees
    this.palmTrees.forEach(t => {
      if (t.alive && Math.abs(t.x - cx) < radius) t.alive = false;
    });
    // Destroy nearby huts
    this.huts.forEach(h => {
      if (h.alive && Math.abs(h.x - cx) < radius + h.w) h.alive = false;
    });
  },

  // Burn napalm along surface
  burnSurface(cx, spread) {
    for (let x = Math.floor(cx - spread); x <= Math.ceil(cx + spread); x++) {
      if (x < 0 || x >= W) continue;
      this.data[x] = Math.min(H * 0.85, this.data[x] + 5 + Math.random() * 5);
    }
  },

  draw(ctx) {
    // Terrain fill
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < W; x++) {
      ctx.lineTo(x, this.data[x]);
    }
    ctx.lineTo(W, H);
    ctx.closePath();

    // Sandy gradient
    const tGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
    tGrad.addColorStop(0, '#c4a44a');
    tGrad.addColorStop(0.3, '#b0903a');
    tGrad.addColorStop(1, '#8a6e2f');
    ctx.fillStyle = tGrad;
    ctx.fill();

    // Green grass strip on top of terrain
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < W; x++) {
      ctx.lineTo(x, this.data[x]);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.save();
    ctx.clip();
    for (let x = 0; x < W; x++) {
      const grassH = 8 + Math.sin(x * 0.1) * 2;
      const gy = this.data[x];
      ctx.fillStyle = '#3a8c3a';
      ctx.fillRect(x, gy, 1, grassH);
      ctx.fillStyle = '#2e7a2e';
      ctx.fillRect(x, gy, 1, 3);
    }
    ctx.restore();

    // Terrain top edge highlight
    ctx.beginPath();
    for (let x = 0; x < W; x += 2) {
      ctx.lineTo(x, this.data[x]);
    }
    ctx.strokeStyle = '#4a9a4a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Palm trees
    this.palmTrees.forEach(t => {
      if (!t.alive) return;
      const tx = t.x, ty = this.data[Math.floor(tx)];
      const h = 55 + (t.x % 20); // vary height
      const lean = Math.sin(t.x * 0.3) * 10;
      const topX = tx + lean, topY = ty - h;
      // Trunk shadow
      ctx.strokeStyle = '#4a2a10';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + lean * 0.5, ty - h * 0.5, topX, topY);
      ctx.stroke();
      // Trunk
      ctx.strokeStyle = '#8b5a2b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + lean * 0.5, ty - h * 0.5, topX, topY);
      ctx.stroke();
      // Trunk rings
      ctx.strokeStyle = '#6b3a1b';
      ctx.lineWidth = 1;
      for (let r = 0.2; r < 0.9; r += 0.15) {
        const rx = tx + lean * r, ry = ty - h * r;
        ctx.beginPath();
        ctx.moveTo(rx - 3, ry); ctx.lineTo(rx + 3, ry);
        ctx.stroke();
      }
      // Leaves (7 fronds, drooping)
      for (let a = 0; a < 7; a++) {
        const angle = -Math.PI / 2 + (a - 3) * 0.45;
        const len = 30 + Math.random() * 10;
        const droop = 12;
        const endX = topX + Math.cos(angle) * len;
        const endY = topY + Math.sin(angle) * len + droop;
        const cpX = topX + Math.cos(angle) * len * 0.6;
        const cpY = topY + Math.sin(angle) * len * 0.3;
        // Leaf shadow
        ctx.strokeStyle = '#1a5a1a';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(topX, topY);
        ctx.quadraticCurveTo(cpX, cpY, endX, endY);
        ctx.stroke();
        // Leaf
        ctx.strokeStyle = '#2d8a2d';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(topX, topY);
        ctx.quadraticCurveTo(cpX, cpY, endX, endY);
        ctx.stroke();
      }
      // Coconuts (2-3 at base of fronds)
      ctx.fillStyle = '#6b3a1b';
      for (let c = 0; c < 3; c++) {
        const cx = topX - 4 + c * 4, cy = topY + 2 + c * 2;
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
      }
    });

    // Huts
    this.huts.forEach(h => {
      if (!h.alive) return;
      const hx = h.x, hy = this.data[Math.floor(hx)];
      const hw = h.w, hh = h.h;
      // Wall
      ctx.fillStyle = '#c9a96e';
      ctx.fillRect(hx - hw/2, hy - hh, hw, hh);
      ctx.strokeStyle = '#8a6e3a';
      ctx.lineWidth = 1;
      ctx.strokeRect(hx - hw/2, hy - hh, hw, hh);
      // Door
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(hx - 3, hy - 10, 6, 10);
      // Thatched roof (triangle)
      ctx.beginPath();
      ctx.moveTo(hx - hw/2 - 5, hy - hh);
      ctx.lineTo(hx, hy - hh - 12);
      ctx.lineTo(hx + hw/2 + 5, hy - hh);
      ctx.closePath();
      ctx.fillStyle = '#8a6a2a';
      ctx.fill();
      ctx.strokeStyle = '#6a4a1a';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Straw texture lines on roof
      ctx.strokeStyle = '#a07a3a';
      ctx.lineWidth = 0.5;
      for (let s = -hw/2; s < hw/2; s += 4) {
        ctx.beginPath();
        ctx.moveTo(hx + s, hy - hh);
        ctx.lineTo(hx + s * 0.3, hy - hh - 10);
        ctx.stroke();
      }
    });
  }
};

// --- Tank ---
class Tank {
  constructor(name, color, x, isAI, aiDiff) {
    this.name = name;
    this.color = color;
    this.x = x;
    this.y = 0;
    this.hp = 100;
    this.maxHp = 100;
    this.angle = 45;
    this.power = 50;
    this.coins = 200;
    this.isAI = isAI || false;
    this.aiDifficulty = aiDiff || 'medium';
    this.weapons = { shell: Infinity };
    this.currentWeapon = 'shell';
    this.shield = false;
    this.width = 28;
    this.height = 14;
    this.barrelLen = 20;
    this.facingRight = true;
    this.falling = false;
  }

  updateY() {
    this.y = Terrain.heightAt(this.x);
  }

  // Apply gravity — check if tank should fall into crater
  applyGravity() {
    const targetY = Terrain.heightAt(this.x);
    if (this.y < targetY) {
      this.y = Math.min(this.y + 3, targetY);
      return this.y < targetY; // still falling
    }
    return false;
  }

  draw(ctx, isActive) {
    const tx = this.x, ty = this.y;
    // Shield glow
    if (this.shield) {
      ctx.beginPath();
      ctx.arc(tx, ty - 10, 25, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,200,255,0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    // Tank body
    ctx.fillStyle = this.color;
    ctx.fillRect(tx - this.width / 2, ty - this.height, this.width, this.height);
    // Turret dome
    ctx.beginPath();
    ctx.arc(tx, ty - this.height, 8, Math.PI, 0);
    ctx.fillStyle = this.color;
    ctx.fill();
    // Darker outline
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(tx - this.width / 2, ty - this.height, this.width, this.height);
    ctx.beginPath();
    ctx.arc(tx, ty - this.height, 8, Math.PI, 0);
    ctx.stroke();
    // Barrel
    const radAngle = this.facingRight
      ? -this.angle * Math.PI / 180
      : -(180 - this.angle) * Math.PI / 180;
    const bx = tx + Math.cos(radAngle) * this.barrelLen;
    const by = ty - this.height + Math.sin(radAngle) * this.barrelLen;
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tx, ty - this.height);
    ctx.lineTo(bx, by);
    ctx.stroke();
    // Tracks
    ctx.fillStyle = '#333';
    ctx.fillRect(tx - this.width / 2 - 2, ty - 3, this.width + 4, 4);
    // HP bar above
    const hpW = 30;
    const hpX = tx - hpW / 2;
    const hpY = ty - this.height - 22;
    ctx.fillStyle = '#333';
    ctx.fillRect(hpX, hpY, hpW, 5);
    ctx.fillStyle = this.hp > 50 ? '#4f4' : this.hp > 25 ? '#ff0' : '#f44';
    ctx.fillRect(hpX, hpY, hpW * (this.hp / this.maxHp), 5);
    // Name
    ctx.fillStyle = '#fff';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, tx, hpY - 3);
    // Active indicator
    if (isActive) {
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.moveTo(tx, hpY - 14);
      ctx.lineTo(tx - 5, hpY - 8);
      ctx.lineTo(tx + 5, hpY - 8);
      ctx.fill();
    }
  }

  getBarrelTip() {
    const radAngle = this.facingRight
      ? -this.angle * Math.PI / 180
      : -(180 - this.angle) * Math.PI / 180;
    return {
      x: this.x + Math.cos(radAngle) * this.barrelLen,
      y: this.y - this.height + Math.sin(radAngle) * this.barrelLen
    };
  }
}

// --- Cloud Frederic ---
const Frederic = {
  x: 0, y: 0, targetX: 0, targetY: 0,
  angry: false, angryTimer: 0, phase: 0,

  init() {
    this.x = W * 0.5;
    this.y = H * 0.12;
    this.pickTarget();
  },

  pickTarget() {
    this.targetX = 100 + Math.random() * (W - 200);
    this.targetY = 40 + Math.random() * (H * 0.15);
  },

  update(dt) {
    this.phase += dt * 0.5;
    this.x += (this.targetX - this.x) * 0.005;
    this.y += (this.targetY - this.y) * 0.005;
    this.y += Math.sin(this.phase) * 0.3;
    if (Math.abs(this.x - this.targetX) < 30) this.pickTarget();
    if (this.angryTimer > 0) {
      this.angryTimer -= dt;
      if (this.angryTimer <= 0) this.angry = false;
    }
  },

  makeAngry() {
    this.angry = true;
    this.angryTimer = 3;
  },

  draw(ctx) {
    const cx = this.x, cy = this.y;
    const breathe = Math.sin(this.phase * 2) * 2;
    const scale = this.angry ? 1.15 : 1;
    // Cloud shadow
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 45 + breathe, 35 * scale, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cloud body (overlapping circles) — pulsates when angry
    const baseColor = this.angry ? '#555' : '#dde';
    const darkColor = this.angry ? '#3a3a3a' : '#bbc';
    const puffs = [
      [0, 0, 32 * scale], [-24, 5, 24 * scale], [24, 5, 24 * scale],
      [-12, -14, 20 * scale], [12, -14, 20 * scale], [0, 10, 22 * scale],
      [-18, -4, 16 * scale], [18, -4, 16 * scale]
    ];
    // Outer dark layer
    ctx.fillStyle = darkColor;
    puffs.forEach(([dx, dy, r]) => {
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy + breathe, r + 2, 0, Math.PI * 2);
      ctx.fill();
    });
    // Main cloud fill
    ctx.fillStyle = baseColor;
    puffs.forEach(([dx, dy, r]) => {
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy + breathe, r, 0, Math.PI * 2);
      ctx.fill();
    });
    // Highlight on top
    ctx.fillStyle = this.angry ? '#777' : '#eef';
    [[-10, -14, 14 * scale], [10, -14, 14 * scale], [0, -6, 18 * scale]].forEach(([dx, dy, r]) => {
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy + breathe - 3, r, 0, Math.PI * 2);
      ctx.fill();
    });
    // Face
    const faceY = cy + 2 + breathe;
    // Eyes — bigger, more expressive
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 11, faceY - 5, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 11, faceY - 5, 7, 0, Math.PI * 2); ctx.fill();
    // Pupils (follow nearest tank if angry)
    const pupilOff = this.angry ? Math.sin(this.phase) * 2 : 0;
    ctx.fillStyle = this.angry ? '#c00' : '#222';
    ctx.beginPath(); ctx.arc(cx - 11 + pupilOff, faceY - 4, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 11 + pupilOff, faceY - 4, 3.5, 0, Math.PI * 2); ctx.fill();
    // Eye glint
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 13, faceY - 7, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 9, faceY - 7, 1.5, 0, Math.PI * 2); ctx.fill();
    // Eyebrows (angry = thick, slanted down inward)
    ctx.strokeStyle = '#000';
    ctx.lineWidth = this.angry ? 3 : 2;
    if (this.angry) {
      ctx.beginPath(); ctx.moveTo(cx - 18, faceY - 16); ctx.lineTo(cx - 5, faceY - 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 18, faceY - 16); ctx.lineTo(cx + 5, faceY - 10); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(cx - 17, faceY - 13); ctx.lineTo(cx - 5, faceY - 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 17, faceY - 13); ctx.lineTo(cx + 5, faceY - 14); ctx.stroke();
    }
    // Mouth
    ctx.beginPath();
    if (this.angry) {
      // Open angry mouth with teeth
      ctx.moveTo(cx - 10, faceY + 8);
      ctx.quadraticCurveTo(cx, faceY + 1, cx + 10, faceY + 8);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      // Teeth
      ctx.fillStyle = '#fff';
      for (let t = -6; t <= 6; t += 4) {
        ctx.fillRect(cx + t - 1, faceY + 4, 3, 3);
      }
    } else {
      // Neutral slight frown
      ctx.moveTo(cx - 7, faceY + 6);
      ctx.quadraticCurveTo(cx, faceY + 4, cx + 7, faceY + 6);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    }
    // Cheek blush when angry
    if (this.angry) {
      ctx.fillStyle = 'rgba(200,50,50,0.3)';
      ctx.beginPath(); ctx.arc(cx - 20, faceY + 2, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 20, faceY + 2, 5, 0, Math.PI * 2); ctx.fill();
    }
    // Name
    ctx.fillStyle = this.angry ? '#f44' : '#556';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('Frederic', cx, cy - 36 + breathe);
  }
};

// --- Particles / Effects ---
const Particles = {
  list: [],

  add(x, y, count, color, speed, life) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const sp = (0.5 + Math.random()) * (speed || 3);
      this.list.push({
        x, y, vx: Math.cos(angle) * sp, vy: Math.sin(angle) * sp - 1,
        life: (life || 1) * (0.5 + Math.random() * 0.5),
        maxLife: life || 1, color: color || '#ff0', size: 2 + Math.random() * 3
      });
    }
  },

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy += 0.05;
      p.life -= dt;
      if (p.life <= 0) this.list.splice(i, 1);
    }
  },

  draw(ctx) {
    this.list.forEach(p => {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }
};

// --- Explosion Effect ---
const Explosions = {
  list: [],

  add(x, y, radius) {
    this.list.push({ x, y, radius, time: 0, maxTime: 0.5 });
  },

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      this.list[i].time += dt;
      if (this.list[i].time >= this.list[i].maxTime) this.list.splice(i, 1);
    }
  },

  draw(ctx) {
    this.list.forEach(e => {
      const t = e.time / e.maxTime;
      const r = e.radius * (0.3 + t * 0.7);
      const alpha = 1 - t;
      // Outer glow
      ctx.beginPath();
      ctx.arc(e.x, e.y, r * 1.3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,100,0,${alpha * 0.3})`;
      ctx.fill();
      // Core
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,200,50,${alpha * 0.7})`;
      ctx.fill();
      // Hot center
      ctx.beginPath();
      ctx.arc(e.x, e.y, r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,200,${alpha})`;
      ctx.fill();
    });
  }
};

// --- Projectile ---
const Projectile = {
  active: false,
  x: 0, y: 0, vx: 0, vy: 0,
  trail: [],
  type: 'shell',
  drillDepth: 0,
  drilling: false,

  launch(x, y, angle, power, wind, type) {
    this.active = true;
    this.type = type || 'shell';
    this.drilling = false;
    this.drillDepth = 0;
    const rad = -angle * Math.PI / 180;
    const speed = power * 0.18;
    this.x = x; this.y = y;
    this.vx = Math.cos(rad) * speed;
    this.vy = Math.sin(rad) * speed;
    this.trail = [{ x, y }];
    Audio.fire();
  },

  update(dt, wind, tanks) {
    if (!this.active) return null;
    const steps = 3;
    for (let s = 0; s < steps; s++) {
      // Gravity
      this.vy += 0.08;
      // Wind
      this.vx += wind * 0.0005;
      this.x += this.vx;
      this.y += this.vy;
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 300) this.trail.shift();

      // Off screen
      if (this.x < -50 || this.x > W + 50 || this.y > H + 50) {
        this.active = false;
        return { type: 'miss' };
      }

      // Drill bomb — penetrates terrain
      if (this.type === 'drill' && this.y >= Terrain.heightAt(this.x)) {
        if (!this.drilling) this.drilling = true;
        this.drillDepth++;
        if (this.drillDepth > 40) {
          this.active = false;
          return { type: 'hit', x: this.x, y: this.y, weapon: this.type };
        }
        continue;
      }

      // Terrain collision
      if (this.y >= Terrain.heightAt(this.x) && !this.drilling) {
        this.active = false;
        // Cluster bomb splits
        if (this.type === 'cluster') {
          return { type: 'cluster', x: this.x, y: this.y };
        }
        return { type: 'hit', x: this.x, y: this.y, weapon: this.type };
      }

      // Frederic blocks? (only if Frederic event triggered)
      if (Frederic.blocking) {
        const dx = this.x - Frederic.x, dy = this.y - Frederic.y;
        if (dx * dx + dy * dy < 900) {
          this.active = false;
          Frederic.blocking = false;
          return { type: 'blocked' };
        }
      }

      // Direct tank hit check
      for (const tank of tanks) {
        if (tank.hp <= 0) continue;
        const dx = this.x - tank.x;
        const dy = this.y - (tank.y - tank.height / 2);
        if (Math.abs(dx) < tank.width / 2 + 3 && Math.abs(dy) < tank.height / 2 + 5) {
          this.active = false;
          if (this.type === 'cluster') {
            return { type: 'cluster', x: this.x, y: this.y };
          }
          return { type: 'hit', x: this.x, y: this.y, weapon: this.type, directHit: tank };
        }
      }
    }
    return null; // still flying
  },

  draw(ctx) {
    // Trail
    if (this.trail.length > 1) {
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(255,255,100,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // Projectile
    if (this.active) {
      ctx.fillStyle = this.type === 'napalm' ? '#f80' : this.type === 'nuke' ? '#f0f' : '#ff0';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.type === 'nuke' ? 5 : 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
};

// --- Airstrike ---
const Airstrike = {
  active: false,
  x: 0, y: 0, targetX: 0, bombs: [], bombTimer: 0,
  dropped: 0,

  start(targetX) {
    this.active = true;
    this.x = -50;
    this.y = H * 0.1;
    this.targetX = targetX;
    this.bombs = [];
    this.bombTimer = 0;
    this.dropped = 0;
  },

  update(dt) {
    if (!this.active) return [];
    this.x += 4;
    const results = [];

    // Drop bombs near target
    if (this.x > this.targetX - 80 && this.x < this.targetX + 80) {
      this.bombTimer += dt;
      if (this.bombTimer > 0.15 && this.dropped < 5) {
        this.bombs.push({ x: this.x, y: this.y + 20, vy: 0 });
        this.bombTimer = 0;
        this.dropped++;
      }
    }

    // Update bombs
    for (let i = this.bombs.length - 1; i >= 0; i--) {
      const b = this.bombs[i];
      b.vy += 0.15;
      b.y += b.vy;
      if (b.y >= Terrain.heightAt(b.x)) {
        results.push({ type: 'hit', x: b.x, y: b.y, weapon: 'airstrike' });
        this.bombs.splice(i, 1);
      }
    }

    if (this.x > W + 60 && this.bombs.length === 0) {
      this.active = false;
    }
    return results;
  },

  draw(ctx) {
    if (!this.active) return;
    // Plane
    ctx.fillStyle = '#556';
    ctx.beginPath();
    ctx.moveTo(this.x + 20, this.y);
    ctx.lineTo(this.x - 15, this.y - 5);
    ctx.lineTo(this.x - 20, this.y);
    ctx.lineTo(this.x - 15, this.y + 5);
    ctx.closePath();
    ctx.fill();
    // Wings
    ctx.fillStyle = '#667';
    ctx.fillRect(this.x - 5, this.y - 12, 10, 24);
    // Bombs
    this.bombs.forEach(b => {
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, 3, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }
};

// --- Lightning Effect ---
const Lightning = {
  bolts: [],

  strike(x, groundY) {
    const points = [{ x, y: 0 }];
    let cy = 0;
    while (cy < groundY) {
      cy += 10 + Math.random() * 20;
      x += (Math.random() - 0.5) * 30;
      points.push({ x, y: Math.min(cy, groundY) });
    }
    this.bolts.push({ points, life: 0.5 });
    Audio.thunder();
  },

  update(dt) {
    for (let i = this.bolts.length - 1; i >= 0; i--) {
      this.bolts[i].life -= dt;
      if (this.bolts[i].life <= 0) this.bolts.splice(i, 1);
    }
  },

  draw(ctx) {
    this.bolts.forEach(b => {
      const alpha = Math.max(0, b.life / 0.5);
      ctx.strokeStyle = `rgba(200,200,255,${alpha})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#88f';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      b.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      // Thinner core
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      b.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
  }
};

// --- Main Game Controller ---
const Game = {
  state: 'menu', // menu, playing, shop, animating, gameover
  mode: 'quick', // quick, vsai, campaign
  tanks: [],
  turnIndex: 0,
  wind: 0,
  roundNum: 1,
  maxRounds: 1,
  campaignLevel: 1,
  lastTrail: [],
  cloudEvent: null,
  cloudEventTimer: 0,
  animCallback: null,
  gravityChecking: false,

  // --- Menu ---
  showMenu() {
    this.state = 'menu';
    document.getElementById('menu-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('ai-select').style.display = 'none';
    this.hideMsg();
  },

  showAISelect() {
    document.getElementById('ai-select').style.display = 'flex';
    Audio.click();
  },

  startQuickMatch() {
    Audio.click();
    this.mode = 'quick';
    this.maxRounds = 1;
    this.roundNum = 1;
    this.initRound([
      new Tank('Player 1', '#4a4', 0, false),
      new Tank('Player 2', '#d44', 0, false)
    ]);
  },

  startVsAI(diff) {
    Audio.click();
    this.mode = 'vsai';
    this.maxRounds = 1;
    this.roundNum = 1;
    this.initRound([
      new Tank('Player 1', '#4a4', 0, false),
      new Tank('CPU', '#d44', 0, true, diff)
    ]);
  },

  startCampaign() {
    Audio.click();
    this.mode = 'campaign';
    this.campaignLevel = 1;
    this.maxRounds = 10;
    this.roundNum = 1;
    const diffs = ['easy','easy','easy','medium','medium','medium','hard','hard','hard','hard'];
    this.initRound([
      new Tank('Player 1', '#4a4', 0, false),
      new Tank('CPU Lv' + this.campaignLevel, '#d44', 0, true, diffs[0])
    ]);
  },

  initRound(tanks) {
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('shop-screen').classList.add('hidden');
    this.hideMsg();

    Terrain.generate(W, H);

    // Place tanks on terrain
    const margin = W * 0.15;
    tanks[0].x = margin + Math.random() * (W * 0.2);
    tanks[1].x = W - margin - Math.random() * (W * 0.2);
    tanks[0].facingRight = true;
    tanks[1].facingRight = false;
    tanks.forEach(t => {
      t.hp = 100;
      t.updateY();
      t.shield = false;
    });
    this.tanks = tanks;
    this.turnIndex = 0;
    this.wind = Math.round((Math.random() - 0.5) * 60);
    this.lastTrail = [];
    Frederic.init();
    Frederic.blocking = false;
    Particles.list = [];
    Explosions.list = [];
    Lightning.bolts = [];
    Airstrike.active = false;
    Projectile.active = false;
    Projectile.trail = [];

    this.state = 'playing';
    this.updateHUD();
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    this.updateControls();

    if (!this._looping) { this._looping = true; this.lastTime = performance.now(); requestAnimationFrame(t => this.loop(t)); }
  },

  // --- HUD ---
  updateHUD() {
    const cur = this.tanks[this.turnIndex];
    document.getElementById('hud-turn').textContent = cur.name + "'s turn";
    document.getElementById('hud-turn').style.color = cur.color;
    const windStr = (this.wind > 0 ? '→ ' : this.wind < 0 ? '← ' : '') + Math.abs(this.wind);
    document.getElementById('hud-wind').textContent = windStr;
    document.getElementById('hud-hp1').style.width = Math.max(0, this.tanks[0].hp) + '%';
    document.getElementById('hud-hp2').style.width = Math.max(0, this.tanks[1].hp) + '%';
    document.getElementById('hud-weapon').textContent = WEAPONS[cur.currentWeapon].name;
    document.getElementById('hud-coins').textContent = cur.coins;
  },

  updateControls() {
    const cur = this.tanks[this.turnIndex];
    document.getElementById('ctrl-angle').value = cur.angle;
    document.getElementById('ctrl-angle-val').textContent = cur.angle + '°';
    document.getElementById('ctrl-power').value = cur.power;
    document.getElementById('ctrl-power-val').textContent = cur.power + '%';
    const w = WEAPONS[cur.currentWeapon];
    const count = cur.weapons[cur.currentWeapon];
    document.getElementById('weapon-cycle').textContent = w.icon + ' ' + w.name + (count === Infinity ? ' ∞' : ' ×' + count);
    document.getElementById('fire-btn').disabled = (this.state !== 'playing');
  },

  cycleWeapon() {
    const cur = this.tanks[this.turnIndex];
    const keys = Object.keys(cur.weapons);
    const idx = keys.indexOf(cur.currentWeapon);
    cur.currentWeapon = keys[(idx + 1) % keys.length];
    Audio.click();
    this.updateControls();
    this.updateHUD();
  },

  // --- Firing ---
  fire() {
    if (this.state !== 'playing') return;
    const cur = this.tanks[this.turnIndex];
    cur.angle = parseInt(document.getElementById('ctrl-angle').value);
    cur.power = parseInt(document.getElementById('ctrl-power').value);
    const weapon = cur.currentWeapon;

    // Handle special weapons
    if (weapon === 'shield') {
      cur.shield = true;
      this.useWeapon(cur, weapon);
      this.showMsg('Shield activated!', 1000);
      setTimeout(() => this.endTurn(), 1200);
      return;
    }
    if (weapon === 'teleport') {
      cur.x = 50 + Math.random() * (W - 100);
      cur.updateY();
      this.useWeapon(cur, weapon);
      Particles.add(cur.x, cur.y, 20, '#0ff', 4, 0.5);
      this.showMsg('Teleported!', 1000);
      setTimeout(() => this.endTurn(), 1200);
      return;
    }
    if (weapon === 'airstrike') {
      const enemy = this.tanks[1 - this.turnIndex];
      Airstrike.start(enemy.x);
      this.useWeapon(cur, weapon);
      this.state = 'animating';
      document.getElementById('fire-btn').disabled = true;
      return;
    }

    // Normal projectile
    const tip = cur.getBarrelTip();
    const actualAngle = cur.facingRight ? cur.angle : (180 - cur.angle);
    Projectile.launch(tip.x, tip.y, actualAngle, cur.power, this.wind, weapon);
    this.useWeapon(cur, weapon);
    this.state = 'animating';
    document.getElementById('fire-btn').disabled = true;
  },

  useWeapon(tank, weapon) {
    if (tank.weapons[weapon] !== Infinity) {
      tank.weapons[weapon]--;
      if (tank.weapons[weapon] <= 0) {
        delete tank.weapons[weapon];
        tank.currentWeapon = 'shell';
      }
    }
  },

  // --- Hit Processing ---
  processHit(result) {
    if (result.type === 'miss') {
      this.lastTrail = [...Projectile.trail];
      this.endTurn();
      return;
    }
    if (result.type === 'blocked') {
      this.showMsg('Frederic blocked the shot!', 1500);
      this.lastTrail = [...Projectile.trail];
      setTimeout(() => this.endTurn(), 1500);
      return;
    }
    if (result.type === 'cluster') {
      // Spawn 5 mini explosions
      this.lastTrail = [...Projectile.trail];
      const cx = result.x, cy = result.y;
      let pending = 5;
      for (let i = 0; i < 5; i++) {
        const bx = cx + (Math.random() - 0.5) * 80;
        const by = cy + (Math.random() - 0.5) * 40;
        setTimeout(() => {
          this.doExplosion(bx, Math.max(by, Terrain.heightAt(bx)), WEAPONS.cluster.radius, WEAPONS.cluster.damage);
          pending--;
          if (pending === 0) this.postExplosion();
        }, 100 + i * 150);
      }
      return;
    }
    if (result.type === 'hit') {
      this.lastTrail = [...Projectile.trail];
      const w = WEAPONS[result.weapon] || WEAPONS.shell;
      if (result.weapon === 'napalm') {
        this.doExplosion(result.x, result.y, w.radius, w.damage);
        Terrain.burnSurface(result.x, 60);
        // Fire particles along surface
        for (let fx = result.x - 60; fx < result.x + 60; fx += 10) {
          Particles.add(fx, Terrain.heightAt(fx), 3, '#f80', 2, 1.5);
        }
        // Extra damage to tanks in napalm zone
        this.tanks.forEach(t => {
          if (Math.abs(t.x - result.x) < 60) {
            this.damageTank(t, 15);
          }
        });
        this.postExplosion();
      } else {
        this.doExplosion(result.x, result.y, w.radius, w.damage);
        this.postExplosion();
      }
      return;
    }
  },

  doExplosion(x, y, radius, damage) {
    Terrain.crater(x, y, radius);
    Explosions.add(x, y, radius);
    Particles.add(x, y, 15 + radius, '#f80', 3 + radius * 0.05, 0.8);
    Particles.add(x, y, 5, '#fff', 2, 0.3);
    Audio.explode(radius > 50);

    // Damage tanks in blast radius
    this.tanks.forEach(t => {
      if (t.hp <= 0) return;
      const dist = Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2);
      if (dist < radius + 15) {
        const falloff = Math.max(0, 1 - dist / (radius + 15));
        const dmg = Math.round(damage * falloff);
        this.damageTank(t, dmg);
      }
    });
  },

  damageTank(tank, dmg) {
    if (tank.shield) {
      tank.shield = false;
      Particles.add(tank.x, tank.y - 10, 10, '#0ff', 3, 0.5);
      return;
    }
    tank.hp = Math.max(0, tank.hp - dmg);
    // Award coins to shooter
    const shooter = this.tanks[this.turnIndex];
    if (tank !== shooter) {
      shooter.coins += dmg * 2;
    }
  },

  postExplosion() {
    // Let tanks settle with gravity
    this.gravityChecking = true;
    const settle = () => {
      let anyFalling = false;
      this.tanks.forEach(t => {
        if (t.hp > 0 && t.applyGravity()) anyFalling = true;
      });
      if (anyFalling) {
        requestAnimationFrame(settle);
      } else {
        this.gravityChecking = false;
        // Check win
        const alive = this.tanks.filter(t => t.hp > 0);
        if (alive.length <= 1) {
          this.roundOver(alive[0] || null);
        } else {
          this.endTurn();
        }
      }
    };
    setTimeout(settle, 300);
  },

  endTurn() {
    this.turnIndex = 1 - this.turnIndex;
    this.wind += Math.round((Math.random() - 0.5) * 20);
    this.wind = Math.max(-60, Math.min(60, this.wind));
    this.state = 'playing';

    // Cloud event (15% chance)
    this.cloudEvent = null;
    Frederic.blocking = false;
    if (Math.random() < 0.15) {
      this.triggerCloudEvent();
    }

    this.updateHUD();
    this.updateControls();

    // AI turn
    const cur = this.tanks[this.turnIndex];
    if (cur.isAI && cur.hp > 0) {
      document.getElementById('fire-btn').disabled = true;
      setTimeout(() => this.aiTurn(), 800);
    }
  },

  // --- Cloud Events ---
  triggerCloudEvent() {
    const events = ['lightning', 'rain', 'gust', 'block'];
    const ev = events[Math.floor(Math.random() * events.length)];
    Frederic.makeAngry();

    switch (ev) {
      case 'lightning': {
        const x = 50 + Math.random() * (W - 100);
        const y = Terrain.heightAt(x);
        Lightning.strike(x, y);
        Terrain.crater(x, y, 20);
        this.tanks.forEach(t => {
          if (Math.abs(t.x - x) < 25) this.damageTank(t, 15);
        });
        this.showMsg("Frederic strikes with lightning!", 1500);
        break;
      }
      case 'rain': {
        this.showMsg("Rain! Terrain gets slippery!", 1500);
        // Tanks slide slightly toward lower terrain
        this.tanks.forEach(t => {
          const leftH = Terrain.heightAt(t.x - 10);
          const rightH = Terrain.heightAt(t.x + 10);
          if (leftH > rightH) t.x += 8;
          else if (rightH > leftH) t.x -= 8;
          t.x = Math.max(20, Math.min(W - 20, t.x));
          t.updateY();
        });
        // Rain particles
        for (let i = 0; i < 50; i++) {
          Particles.add(Math.random() * W, Math.random() * H * 0.5, 1, '#8af', 1, 2);
        }
        break;
      }
      case 'gust': {
        this.wind *= 2;
        this.wind = Math.max(-80, Math.min(80, this.wind));
        this.showMsg("Strong gust! Wind doubled!", 1500);
        Audio.wind();
        break;
      }
      case 'block': {
        Frederic.blocking = true;
        // Move Frederic between the tanks
        Frederic.x = (this.tanks[0].x + this.tanks[1].x) / 2;
        Frederic.y = H * 0.2;
        this.showMsg("Frederic might block your shot!", 1500);
        break;
      }
    }
  },

  // --- AI ---
  aiTurn() {
    const ai = this.tanks[this.turnIndex];
    const target = this.tanks[1 - this.turnIndex];
    const diff = ai.aiDifficulty;

    // Calculate angle to target
    const dx = target.x - ai.x;
    const dy = target.y - ai.y;
    const dist = Math.abs(dx);

    // Basic ballistic calculation
    let bestAngle = 45;
    let bestPower = 50;

    // Simplified trajectory estimation
    const g = 0.08 * 3; // gravity per frame * steps
    const windEffect = this.wind * 0.0005 * 3;

    // Try to find good angle/power
    let bestErr = Infinity;
    const angleRange = diff === 'easy' ? 30 : diff === 'medium' ? 10 : 3;
    const trials = diff === 'easy' ? 20 : diff === 'medium' ? 50 : 100;

    for (let trial = 0; trial < trials; trial++) {
      const testAngle = 10 + Math.random() * 80;
      const testPower = 20 + Math.random() * 80;
      const rad = -(ai.facingRight ? testAngle : (180 - testAngle)) * Math.PI / 180;
      const speed = testPower * 0.18;
      let vx = Math.cos(rad) * speed;
      let vy = Math.sin(rad) * speed;
      let sx = ai.x, sy = ai.y - ai.height;

      // Simulate
      let hit = false;
      for (let step = 0; step < 500; step++) {
        vy += 0.08;
        vx += windEffect / 3;
        sx += vx; sy += vy;
        if (sy > H + 50) break;
        if (sy >= Terrain.heightAt(sx)) {
          const err = Math.sqrt((sx - target.x) ** 2 + (sy - target.y) ** 2);
          if (err < bestErr) {
            bestErr = err;
            bestAngle = testAngle;
            bestPower = testPower;
          }
          hit = true;
          break;
        }
      }
    }

    // Add noise based on difficulty
    bestAngle += (Math.random() - 0.5) * angleRange * 2;
    bestPower += (Math.random() - 0.5) * angleRange;
    bestAngle = Math.max(5, Math.min(85, bestAngle));
    bestPower = Math.max(15, Math.min(100, bestPower));

    ai.angle = Math.round(bestAngle);
    ai.power = Math.round(bestPower);

    // Update sliders to show AI's choice
    document.getElementById('ctrl-angle').value = ai.angle;
    document.getElementById('ctrl-angle-val').textContent = ai.angle + '°';
    document.getElementById('ctrl-power').value = ai.power;
    document.getElementById('ctrl-power-val').textContent = ai.power + '%';

    setTimeout(() => {
      if (this.state === 'playing') this.fire();
    }, 500);
  },

  // --- Round Over ---
  roundOver(winner) {
    this.state = 'gameover';
    document.getElementById('controls').classList.add('hidden');

    if (winner) {
      winner.coins += 100;
      Audio.win();
      this.showMsg(winner.name + ' WINS!', 0);
    } else {
      this.showMsg('DRAW!', 0);
    }

    setTimeout(() => {
      if (this.mode === 'campaign' && winner && !winner.isAI) {
        this.campaignLevel++;
        if (this.campaignLevel > 10) {
          this.showMsg('CAMPAIGN COMPLETE! You are the Tank Blaster champion!', 0);
          setTimeout(() => this.showMenu(), 3000);
        } else {
          this.openShop(winner);
        }
      } else if (this.mode === 'campaign' && (!winner || winner.isAI)) {
        this.showMsg('Campaign Over — You reached level ' + this.campaignLevel, 0);
        setTimeout(() => this.showMenu(), 3000);
      } else {
        setTimeout(() => this.showMenu(), 3000);
      }
    }, 2000);
  },

  // --- Shop ---
  openShop(playerTank) {
    this.hideMsg();
    this.state = 'shop';
    document.getElementById('hud').classList.add('hidden');
    const shopEl = document.getElementById('shop-screen');
    shopEl.classList.remove('hidden');
    document.getElementById('shop-coins').textContent = 'Coins: ' + playerTank.coins;

    const grid = document.getElementById('shop-grid');
    grid.innerHTML = '';
    Object.entries(WEAPONS).forEach(([key, w]) => {
      if (key === 'shell') return; // always free
      const item = document.createElement('div');
      item.className = 'shop-item';
      const owned = playerTank.weapons[key] > 0;
      if (owned) item.classList.add('owned');
      item.innerHTML = `
        <div class="shop-item-name">${w.icon} ${w.name}</div>
        <div class="shop-item-price">${w.price} coins${owned ? ' (owned: '+ playerTank.weapons[key]+')' : ''}</div>
        <div class="shop-item-desc">${w.desc}</div>
      `;
      item.onclick = () => {
        if (playerTank.coins >= w.price) {
          playerTank.coins -= w.price;
          playerTank.weapons[key] = (playerTank.weapons[key] || 0) + 1;
          Audio.click();
          document.getElementById('shop-coins').textContent = 'Coins: ' + playerTank.coins;
          // Refresh
          this.openShop(playerTank);
        }
      };
      grid.appendChild(item);
    });

    this._shopTank = playerTank;
  },

  closeShop() {
    Audio.click();
    document.getElementById('shop-screen').classList.add('hidden');
    const diffs = ['easy','easy','easy','medium','medium','medium','hard','hard','hard','hard'];
    const p = this._shopTank;
    this.initRound([
      p,
      new Tank('CPU Lv' + this.campaignLevel, '#d44', 0, true, diffs[this.campaignLevel - 1])
    ]);
  },

  // --- Messaging ---
  showMsg(text, autoHide) {
    const el = document.getElementById('msg-box');
    el.innerHTML = text;
    el.classList.remove('hidden');
    if (autoHide > 0) setTimeout(() => el.classList.add('hidden'), autoHide);
  },
  hideMsg() { document.getElementById('msg-box').classList.add('hidden'); },

  // --- Rendering ---
  render() {
    ctx.clearRect(0, 0, W, H);

    // Tropical sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    skyGrad.addColorStop(0, '#1e90ff');
    skyGrad.addColorStop(0.3, '#4db8ff');
    skyGrad.addColorStop(0.6, '#87ceeb');
    skyGrad.addColorStop(0.85, '#ffe4b5');
    skyGrad.addColorStop(1, '#ff9966');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Sun
    const sunX = W * 0.82, sunY = H * 0.18;
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 80);
    sunGlow.addColorStop(0, 'rgba(255,255,200,0.9)');
    sunGlow.addColorStop(0.3, 'rgba(255,200,100,0.4)');
    sunGlow.addColorStop(1, 'rgba(255,150,50,0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(sunX - 80, sunY - 80, 160, 160);
    ctx.beginPath();
    ctx.arc(sunX, sunY, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#fff5cc';
    ctx.fill();

    // Background decorative clouds
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    const bgClouds = [[W*0.1, H*0.08, 40], [W*0.35, H*0.14, 30], [W*0.6, H*0.06, 35], [W*0.9, H*0.11, 25]];
    bgClouds.forEach(([cx,cy,r]) => {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx-r*0.6, cy+4, r*0.7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+r*0.6, cy+4, r*0.7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy+6, r*0.5, 0, Math.PI*2); ctx.fill();
    });

    // Ocean
    const waterY = H * 0.85;
    // Beach foam strip
    ctx.fillStyle = '#e8d8a8';
    ctx.fillRect(0, waterY - 3, W, 6);
    // Water
    const waterGrad = ctx.createLinearGradient(0, waterY, 0, H);
    waterGrad.addColorStop(0, '#2a9ad4');
    waterGrad.addColorStop(0.3, '#1a7ab4');
    waterGrad.addColorStop(0.7, '#0d5a8d');
    waterGrad.addColorStop(1, '#063a5d');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, waterY, W, H - waterY);
    // Wave highlights (animated)
    const waveTime = performance.now() * 0.001;
    // Foam wave at shore
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let wx = 0; wx < W; wx += 2) {
      const wh = Math.sin(wx * 0.03 + waveTime * 2) * 2;
      wx === 0 ? ctx.moveTo(wx, waterY + wh) : ctx.lineTo(wx, waterY + wh);
    }
    ctx.stroke();
    // Deeper wave lines
    ctx.strokeStyle = 'rgba(100,200,255,0.2)';
    ctx.lineWidth = 1;
    for (let wy = waterY + 8; wy < H; wy += 14) {
      ctx.beginPath();
      for (let wx = 0; wx < W; wx += 3) {
        const wh = Math.sin(wx * 0.02 + waveTime + wy * 0.1) * 2;
        wx === 0 ? ctx.moveTo(wx, wy + wh) : ctx.lineTo(wx, wy + wh);
      }
      ctx.stroke();
    }
    // Sparkle reflections on water
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let s = 0; s < 12; s++) {
      const sx = ((s * 97.3 + waveTime * 20) % W);
      const sy = waterY + 5 + ((s * 41.7) % (H - waterY - 10));
      if (Math.sin(waveTime * 3 + s) > 0.7) {
        ctx.fillRect(sx, sy, 2, 1);
      }
    }

    // Terrain
    Terrain.draw(ctx);

    // Trail from last shot
    if (this.lastTrail.length > 1) {
      ctx.setLineDash([3, 5]);
      ctx.strokeStyle = 'rgba(255,255,100,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      this.lastTrail.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Tanks
    this.tanks.forEach((t, i) => {
      if (t.hp > 0) t.draw(ctx, i === this.turnIndex && this.state === 'playing');
    });

    // Frederic
    Frederic.draw(ctx);

    // Projectile
    Projectile.draw(ctx);

    // Airstrike
    Airstrike.draw(ctx);

    // Effects
    Explosions.draw(ctx);
    Particles.draw(ctx);
    Lightning.draw(ctx);
  },

  // --- Game Loop ---
  lastTime: 0,
  loop(time) {
    const dt = Math.min(0.05, (time - this.lastTime) / 1000);
    this.lastTime = time;

    // Update
    Frederic.update(dt);
    Particles.update(dt);
    Explosions.update(dt);
    Lightning.update(dt);

    // Projectile
    if (Projectile.active) {
      const result = Projectile.update(dt, this.wind, this.tanks);
      if (result) this.processHit(result);
    }

    // Airstrike
    if (Airstrike.active) {
      const hits = Airstrike.update(dt);
      hits.forEach(h => {
        const w = WEAPONS.airstrike;
        this.doExplosion(h.x, h.y, w.radius, w.damage);
      });
      if (!Airstrike.active) {
        this.postExplosion();
      }
    }

    // Gravity settling
    if (this.gravityChecking) {
      this.tanks.forEach(t => { if (t.hp > 0) t.applyGravity(); });
    }

    this.render();
    requestAnimationFrame(t => this.loop(t));
  },
};

// --- Slider Events ---
document.getElementById('ctrl-angle').addEventListener('input', function() {
  document.getElementById('ctrl-angle-val').textContent = this.value + '°';
  if (Game.state === 'playing') Game.tanks[Game.turnIndex].angle = parseInt(this.value);
});
document.getElementById('ctrl-power').addEventListener('input', function() {
  document.getElementById('ctrl-power-val').textContent = this.value + '%';
  if (Game.state === 'playing') Game.tanks[Game.turnIndex].power = parseInt(this.value);
});

// --- Keyboard Controls ---
document.addEventListener('keydown', e => {
  if (Game.state !== 'playing') return;
  const cur = Game.tanks[Game.turnIndex];
  if (cur.isAI) return;
  const angleEl = document.getElementById('ctrl-angle');
  const powerEl = document.getElementById('ctrl-power');
  switch (e.key) {
    case 'ArrowLeft':
      cur.angle = Math.min(180, cur.angle + 1);
      angleEl.value = cur.angle;
      document.getElementById('ctrl-angle-val').textContent = cur.angle + '°';
      break;
    case 'ArrowRight':
      cur.angle = Math.max(0, cur.angle - 1);
      angleEl.value = cur.angle;
      document.getElementById('ctrl-angle-val').textContent = cur.angle + '°';
      break;
    case 'ArrowUp':
      cur.power = Math.min(100, cur.power + 1);
      powerEl.value = cur.power;
      document.getElementById('ctrl-power-val').textContent = cur.power + '%';
      break;
    case 'ArrowDown':
      cur.power = Math.max(5, cur.power - 1);
      powerEl.value = cur.power;
      document.getElementById('ctrl-power-val').textContent = cur.power + '%';
      break;
    case ' ':
    case 'Enter':
      e.preventDefault();
      Game.fire();
      break;
    case 'Tab':
      e.preventDefault();
      Game.cycleWeapon();
      break;
  }
});

// --- Initial render for menu background ---
Terrain.generate(W, H);
Frederic.init();
Game._looping = true;
Game.lastTime = performance.now();
requestAnimationFrame(t => Game.loop(t));
</script>
